        ];
        // STATO DELL'APP
        let state = {
            currentQuiz: [],
            currentIndex: 0,
            score: 0,
            isReviewMode: false,
            sessionErrors: [],
            sessionFlags: [], 
            errorBank: [],
            history: [],
            questionExposure: {} 
        };

        // STATISTICHE GLOBALI
        let globalStats = { totalQuizzes: 0, totalQuestions: 0, correctAnswers: 0 };
        let trendChartInstance = null;

        // INIZIALIZZAZIONE E LOCAL STORAGE
        window.onload = function() {
            initTheme();
            loadData();
            updateUIHome();
            setupKeyboardShortcuts();
        };

        // GESTIONE COMANDI DA TASTIERA
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                // Evita scatti multipli involontari se si tiene premuto il tasto a lungo
                if (e.repeat && (e.key === 'Enter' || e.key === ' ')) return;

                const isQuizView = !document.getElementById('quiz-view').classList.contains('hidden');
                const isResultView = !document.getElementById('result-view').classList.contains('hidden');
                const isHomeView = !document.getElementById('home-view').classList.contains('hidden');

                if (isQuizView) {
                    // Tasti 1-5 per selezionare l'opzione (alcune domande hanno 5 risposte)
                    if (['1', '2', '3', '4', '5'].includes(e.key)) {
                        const index = parseInt(e.key) - 1;
                        const buttons = document.getElementById('options-container').querySelectorAll('button');
                        if (buttons[index] && !buttons[index].disabled) {
                            buttons[index].click();
                        }
                    }

                    // Tasto 'R' per contrassegnare/rimuovere il dubbio (Revisionare)
                    if (e.key.toLowerCase() === 'r') {
                        toggleFlag();
                    }
                    
                    // Spazio o Invio per andare avanti
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        if (document.activeElement) document.activeElement.blur(); // Rimuove il focus per evitare "click fantasma"
                        
                        if (!document.getElementById('btn-next').classList.contains('hidden')) {
                            document.getElementById('btn-next').click();
                        } else if (!document.getElementById('btn-finish').classList.contains('hidden')) {
                            document.getElementById('btn-finish').click();
                        }
                    }
                } else if (isResultView) {
                    // Spazio o Invio per tornare alla Home dopo aver visto i risultati
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        if (document.activeElement) document.activeElement.blur();
                        returnToHome();
                    }
                } else if (isHomeView) {
                    // Spazio o Invio per avviare un nuovo quiz rapido
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        if (document.activeElement) document.activeElement.blur();
                        startQuiz('new');
                    }
                    // Tasto 'R' per far partire al volo il ripasso errori (se abilitato)
                    if (e.key.toLowerCase() === 'r') {
                        e.preventDefault();
                        const reviewBtn = document.getElementById('btn-review-errors');
                        if (!reviewBtn.disabled) {
                            startQuiz('review');
                        }
                    }
                }
            });
        }

        // GESTIONE TEMA DARK MODE
        function initTheme() {
            const storedTheme = localStorage.getItem('endocrino_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = storedTheme === 'dark' || (!storedTheme && prefersDark);
            
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeUI(isDark);
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('endocrino_theme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
            
            // Rimuove il focus dal bottone appena viene cliccato
            const toggleBtn = document.getElementById('theme-toggle');
            if (toggleBtn) toggleBtn.blur();
            
            if(!document.getElementById('home-view').classList.contains('hidden')) {
                updateTrendChart(); 
            }
        }

        function updateThemeUI(isDark) {
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if (icon && text) {
                icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
                text.innerText = isDark ? 'Light Mode' : 'Dark Mode';
            }
        }

        function loadData() {
            try {
                const storedErrors = localStorage.getItem('endocrino_errors');
                if (storedErrors) state.errorBank = JSON.parse(storedErrors);

                const storedHistory = localStorage.getItem('endocrino_history');
                if (storedHistory) state.history = JSON.parse(storedHistory);

                const storedStats = localStorage.getItem('endocrino_stats');
                if (storedStats) globalStats = JSON.parse(storedStats);
                
                const storedExposure = localStorage.getItem('endocrino_exposure');
                if (storedExposure) state.questionExposure = JSON.parse(storedExposure);
            } catch(e) { console.error("Errore lettura local storage", e); }
        }

        function saveData() {
            try {
                localStorage.setItem('endocrino_errors', JSON.stringify(state.errorBank));
                localStorage.setItem('endocrino_history', JSON.stringify(state.history));
                localStorage.setItem('endocrino_stats', JSON.stringify(globalStats));
                localStorage.setItem('endocrino_exposure', JSON.stringify(state.questionExposure));
            } catch(e) { console.error("Errore salvataggio local storage", e); }
        }

        function resetData() {
            if (confirm("Vuoi davvero azzerare tutte le tue statistiche, lo storico e gli errori da ripassare? L'azione è irreversibile.")) {
                state.errorBank = [];
                state.history = [];
                state.questionExposure = {};
                globalStats = { totalQuizzes: 0, totalQuestions: 0, correctAnswers: 0 };
                localStorage.removeItem('endocrino_errors');
                localStorage.removeItem('endocrino_history');
                localStorage.removeItem('endocrino_stats');
                localStorage.removeItem('endocrino_exposure');
                updateUIHome();
            }
        }

        // GESTIONE HOME VIEW E STATISTICHE
        function updateUIHome() {
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');

            const errorCount = state.errorBank.length;
            document.getElementById('error-count').innerText = errorCount;
            document.getElementById('btn-review-errors').disabled = errorCount === 0;

            document.getElementById('stat-quizzes').innerText = globalStats.totalQuizzes;
            document.getElementById('stat-questions').innerText = globalStats.totalQuestions;
            
            const acc = globalStats.totalQuestions > 0 
                        ? Math.round((globalStats.correctAnswers / globalStats.totalQuestions) * 100) 
                        : 0;
            document.getElementById('stat-accuracy').innerText = acc + "%";
            
            // Calcolo percentuale Viste sul totale del database
            const coveragePerc = Math.round((globalStats.totalQuestions / allQuestions.length) * 100);
            document.getElementById('stat-coverage').innerText = "(" + coveragePerc + "%)";

            updateTrendChart();
        }

        function updateTrendChart() {
            const canvas = document.getElementById('trendChart');
            const noMsg = document.getElementById('no-history-msg');

            if (state.history.length === 0) {
                canvas.style.display = 'none';
                noMsg.classList.remove('hidden');
                return;
            }

            canvas.style.display = 'block';
            noMsg.classList.add('hidden');

            const chronologicalHistory = [...state.history].reverse();
            
            const labels = chronologicalHistory.map(() => '');
            const dataPoints = chronologicalHistory.map(h => Math.round((h.score / h.total) * 100));

            if (trendChartInstance) {
                trendChartInstance.destroy(); 
            }

            const ctx = canvas.getContext('2d');
            const isDark = document.documentElement.classList.contains('dark');
            
            let gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(17, 24, 39, 0.05)'); 
            gradient.addColorStop(1, isDark ? 'rgba(255, 255, 255, 0.0)' : 'rgba(17, 24, 39, 0.0)'); 

            const lineColor = isDark ? '#d4d4d8' : '#111827';
            const tickColor = isDark ? '#737373' : '#9ca3af';

            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Punteggio (%)',
                        data: dataPoints,
                        borderColor: lineColor, 
                        backgroundColor: gradient,
                        borderWidth: 1.5,
                        pointBackgroundColor: isDark ? '#111827' : '#ffffff',
                        pointBorderColor: lineColor,
                        pointBorderWidth: 1.5,
                        pointRadius: 3,
                        pointHoverRadius: 5,
                        fill: true,
                        tension: 0.4, 
                        clip: false 
                    }]
                },
                options: {
                    layout: {
                        padding: { top: 15, right: 10, left: 0, bottom: 0 }
                    },
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: function(value) { return value + '%' },
                                font: { family: 'Inter', size: 10, weight: '300' },
                                color: tickColor,
                                maxTicksLimit: 5
                            },
                            grid: { display: false, drawBorder: false },
                            border: { display: false }
                        },
                        x: { display: false }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: isDark ? 'rgba(20, 20, 20, 0.95)' : 'rgba(255, 255, 255, 0.95)',
                            titleColor: tickColor,
                            bodyColor: isDark ? '#f3f4f6' : '#111827',
                            borderColor: isDark ? 'rgba(255,255,255,0.1)' : '#f3f4f6',
                            borderWidth: 1,
                            titleFont: { family: 'Inter', size: 10, weight: 'normal' },
                            bodyFont: { family: 'Inter', size: 13, weight: '600' },
                            padding: 10,
                            cornerRadius: 8,
                            displayColors: false,
                            callbacks: {
                                title: function(context) {
                                    const index = context[0].dataIndex;
                                    const item = chronologicalHistory[index];
                                    return item.type === 'Ripasso' ? 'Mod: Ripasso' : 'Mod: Casuale';
                                },
                                label: function(context) {
                                    return context.parsed.y + '%';
                                }
                            }
                        }
                    }
                }
            });
        }

        function changeNum(delta) {
            const input = document.getElementById('num-questions');
            let val = parseInt(input.value);
            if (isNaN(val)) val = 20;
            val += delta;
            if (val < 1) val = 1;
            if (val > 270) val = 270; 
            input.value = val;
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // AVVIO QUIZ CON ALGORITMO DI SMART SPACING
        function startQuiz(mode) {
            state.score = 0;
            state.currentIndex = 0;
            state.sessionErrors = [];
            state.sessionFlags = []; 
            state.isReviewMode = (mode === 'review');

            if (mode === 'new') {
                const num = parseInt(document.getElementById('num-questions').value);
                const validNum = isNaN(num) || num < 1 ? 10 : (num > 270 ? 270 : num); 
                
                let exposureGroups = {};
                allQuestions.forEach(q => {
                    const exp = state.questionExposure[q.id] || 0;
                    if (!exposureGroups[exp]) exposureGroups[exp] = [];
                    exposureGroups[exp].push(q);
                });

                let sortedExposures = Object.keys(exposureGroups).map(Number).sort((a, b) => a - b);

                let prioritizedQuestions = [];
                sortedExposures.forEach(exp => {
                    let group = shuffleArray([...exposureGroups[exp]]);
                    prioritizedQuestions = prioritizedQuestions.concat(group);
                });

                let selectedQuestions = prioritizedQuestions.slice(0, validNum);

                selectedQuestions.forEach(q => {
                    state.questionExposure[q.id] = (state.questionExposure[q.id] || 0) + 1;
                });
                saveData(); 

                state.currentQuiz = shuffleArray(selectedQuestions);
                
            } else {
                state.currentQuiz = allQuestions.filter(q => state.errorBank.includes(q.id));
                state.currentQuiz = shuffleArray(state.currentQuiz);
            }

            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            
            renderQuestion();
        }

        // GESTIONE FLAG (DUBBI)
        function toggleFlag() {
            const btn = document.getElementById('btn-flag');
            const icon = btn.querySelector('i');
            const qId = state.currentQuiz[state.currentIndex].id;
            
            if (state.sessionFlags.includes(qId)) {
                state.sessionFlags = state.sessionFlags.filter(id => id !== qId);
                btn.classList.remove('text-yellow-400', 'dark:text-yellow-500');
                btn.classList.add('text-gray-300', 'dark:text-gray-600');
            } else {
                state.sessionFlags.push(qId);
                btn.classList.remove('text-gray-300', 'dark:text-gray-600');
                btn.classList.add('text-yellow-400', 'dark:text-yellow-500');
            }
        }

        // RENDER DOMANDA
        function renderQuestion() {
            const q = state.currentQuiz[state.currentIndex];
            
            document.getElementById('quiz-progress').innerText = `${state.currentIndex + 1} / ${state.currentQuiz.length} ${state.isReviewMode ? '(Ripasso)' : ''}`;
            document.getElementById('score-live').innerText = `Punti: ${state.score}`;
            document.getElementById('progress-bar-fill').style.width = `${(state.currentIndex / state.currentQuiz.length) * 100}%`;

            const animContainer = document.getElementById('question-anim-container');
            animContainer.classList.remove('slide-in-right');
            void animContainer.offsetWidth; 
            animContainer.classList.add('slide-in-right');

            document.getElementById('question-text').innerText = q.text;

            const flagBtn = document.getElementById('btn-flag');
            if (state.sessionFlags.includes(q.id)) {
                flagBtn.className = "text-yellow-400 dark:text-yellow-500 transition-colors text-lg sm:text-xl shrink-0 mt-1 p-2 -mr-2";
            } else {
                flagBtn.className = "text-gray-300 dark:text-gray-600 hover:text-yellow-400 dark:hover:text-yellow-500 transition-colors text-lg sm:text-xl shrink-0 mt-1 p-2 -mr-2";
            }

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            let shuffledOptions = q.options.map((optText, index) => ({ text: optText, originalIndex: index }));
            shuffledOptions = shuffleArray(shuffledOptions);
            
            shuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-4 sm:px-5 py-3.5 sm:py-4 rounded-2xl border-2 border-gray-200 dark:border-white/10 hover:border-gray-400 dark:hover:border-white/30 hover:bg-gray-50 dark:hover:bg-white/5 transition-all duration-300 font-light text-gray-700 dark:text-gray-300 shadow-sm flex items-center";
                btn.innerHTML = `<span class="opacity-30 mr-3 text-[10px] sm:text-xs font-bold w-4 text-center border-r border-gray-300 dark:border-gray-600 pr-3">${idx+1}</span><span class="text-sm sm:text-base">${opt.text}</span>`;
                btn.dataset.originalIndex = opt.originalIndex; 
                btn.onclick = () => checkAnswer(opt.originalIndex, btn);
                container.appendChild(btn);
            });

            document.getElementById('feedback-area').className = "p-4 sm:p-5 rounded-2xl hidden border-2 transition-all mb-4";
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('btn-finish').classList.add('hidden');
        }

        // LOGICA RISPOSTA
        function checkAnswer(selectedIndex, clickedBtn) {
            const q = state.currentQuiz[state.currentIndex];
            const isCorrect = (selectedIndex === q.correct);
            
            const buttons = document.getElementById('options-container').querySelectorAll('button');
            buttons.forEach((btn) => {
                btn.disabled = true;
                btn.classList.add('disabled-btn');
                
                const originalIdx = parseInt(btn.dataset.originalIndex);
                
                if (originalIdx === q.correct) {
                    btn.classList.add('correct-btn'); 
                    btn.classList.remove('disabled-btn');
                } else if (originalIdx === selectedIndex && !isCorrect) {
                    btn.classList.add('wrong-btn'); 
                    btn.classList.remove('disabled-btn');
                }
            });

            if (isCorrect) {
                state.score++;
                if (state.isReviewMode) {
                    state.errorBank = state.errorBank.filter(id => id !== q.id);
                }
            } else {
                state.sessionErrors.push({...q, isFlagged: false});
                if (!state.errorBank.includes(q.id)) {
                    state.errorBank.push(q.id);
                }
            }

            saveData(); 
            showFeedback(isCorrect, q.explanation);

            if (state.currentIndex < state.currentQuiz.length - 1) {
                document.getElementById('btn-next').classList.remove('hidden');
            } else {
                document.getElementById('progress-bar-fill').style.width = '100%';
                document.getElementById('btn-finish').classList.remove('hidden');
            }
        }

        function showFeedback(isCorrect, explanation) {
            const area = document.getElementById('feedback-area');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            
            area.className = "p-4 sm:p-5 rounded-2xl border-2 transition-all block fade-in mb-4";
            
            if (isCorrect) {
                area.classList.add('bg-green-50/50', 'dark:bg-green-900/30', 'border-green-400', 'dark:border-green-600', 'text-green-800', 'dark:text-green-300');
                icon.innerHTML = '<i class="fas fa-check text-green-600"></i>';
                title.innerText = "Corretta";
            } else {
                area.classList.add('bg-red-50/50', 'dark:bg-red-900/30', 'border-red-400', 'dark:border-red-600', 'text-red-800', 'dark:text-red-300');
                icon.innerHTML = '<i class="fas fa-times text-red-600"></i>';
                title.innerText = "Errata";
            }
            
            document.getElementById('feedback-explanation').innerText = explanation;
        }

        function nextQuestion() {
            state.currentIndex++;
            renderQuestion();
        }

        function finishQuiz() {
            state.sessionFlags.forEach(flagId => {
                if (!state.errorBank.includes(flagId)) {
                    state.errorBank.push(flagId); 
                }
                if (!state.sessionErrors.find(e => e.id === flagId)) {
                    const qObj = allQuestions.find(q => q.id === flagId);
                    state.sessionErrors.push({...qObj, isFlagged: true});
                }
            });

            const dateStr = new Date().toLocaleDateString('it-IT', { hour: '2-digit', minute:'2-digit' });
            state.history.unshift({
                date: dateStr,
                type: state.isReviewMode ? 'Ripasso' : 'Casuale',
                score: state.score,
                total: state.currentQuiz.length
            });
            if (state.history.length > 10) state.history.pop();
            
            globalStats.totalQuizzes++;
            globalStats.totalQuestions += state.currentQuiz.length;
            globalStats.correctAnswers += state.score;

            saveData();

            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');

            const perc = Math.round((state.score / state.currentQuiz.length) * 100);
            document.getElementById('final-score-text').innerText = `${state.score} / ${state.currentQuiz.length}`;
            
            let subtext = "";
            if (perc >= 90) subtext = "Eccezionale. Preparazione molto solida.";
            else if (perc >= 70) subtext = "Ottimo lavoro. Buon livello di preparazione.";
            else if (perc >= 50) subtext = "Sufficiente. Da rivedere alcune lacune.";
            else subtext = "Insufficiente. Richiede ripasso approfondito.";
            document.getElementById('final-score-subtext').innerText = `${perc}% — ${subtext}`;

            const errList = document.getElementById('errors-list');
            errList.innerHTML = '';
            
            if (state.sessionErrors.length === 0) {
                document.getElementById('perfect-score-msg').classList.remove('hidden');
                document.getElementById('session-errors-container').classList.add('hidden');
            } else {
                document.getElementById('perfect-score-msg').classList.add('hidden');
                document.getElementById('session-errors-container').classList.remove('hidden');
                
                state.sessionErrors.forEach(q => {
                    const el = document.createElement('div');
                    el.className = "border-b border-gray-100 dark:border-white/10 pb-5 last:border-0 transition-colors";
                    
                    const badgeHTML = q.isFlagged 
                        ? `<span class="bg-yellow-100 dark:bg-yellow-900/40 text-yellow-800 dark:text-yellow-400 text-[10px] uppercase font-bold px-2 py-0.5 rounded ml-2 tracking-widest"><i class="fas fa-bookmark mr-1"></i> Dubbio</span>`
                        : `<span class="bg-red-100 dark:bg-red-900/40 text-red-800 dark:text-red-400 text-[10px] uppercase font-bold px-2 py-0.5 rounded ml-2 tracking-widest"><i class="fas fa-times mr-1"></i> Errore</span>`;

                    el.innerHTML = `
                        <p class="font-medium text-gray-800 dark:text-gray-200 mb-3 text-sm sm:text-base leading-snug">${q.text} ${badgeHTML}</p>
                        <p class="text-green-600 dark:text-green-400 font-light text-xs sm:text-sm mb-2"><i class="fas fa-arrow-right mr-1 opacity-70"></i> ${q.options[q.correct]}</p>
                        <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 font-light leading-relaxed mt-1">${q.explanation}</p>
                    `;
                    errList.appendChild(el);
                });
            }
        }

        function returnToHome() {
            updateUIHome();
        }

    </script>
</body>
</html>
