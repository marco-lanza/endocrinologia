<!DOCTYPE html>
<html lang="it" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag ottimizzato per impedire lo zoom automatico e goffo su smartphone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Chirurgia Endocrina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-in-right { animation: slideInRight 0.3s ease-out forwards; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        /* Stili standard (Light) */
        .correct-btn { background-color: #f0fdf4 !important; color: #166534 !important; border-color: #4ade80 !important; }
        .wrong-btn { background-color: #fef2f2 !important; color: #991b1b !important; border-color: #f87171 !important; }
        
        /* Stili Dark Mode */
        .dark .correct-btn { background-color: #064e3b !important; color: #4ade80 !important; border-color: #059669 !important; }
        .dark .wrong-btn { background-color: #450a0a !important; color: #f87171 !important; border-color: #dc2626 !important; }
        
        .disabled-btn { opacity: 0.4; cursor: not-allowed; }

        /* Scrollbar Minimal */
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background-color: #d1d5db; border-radius: 20px; }
        .dark .scrollbar-thin::-webkit-scrollbar-thumb { background-color: #4b5563; }
    </style>
</head>
<body class="text-gray-800 dark:text-gray-200 h-screen flex flex-col bg-white dark:bg-black font-light selection:bg-gray-100 dark:selection:bg-white/20 transition-colors duration-300 overflow-x-hidden">

    <!-- Header -->
    <header class="pt-5 pb-4 px-4 sm:px-8 shrink-0 flex flex-col justify-center items-center border-b border-gray-100 dark:border-white/10 transition-colors relative z-10 bg-white dark:bg-black">
        <h1 class="text-sm font-semibold tracking-widest text-gray-900 dark:text-white uppercase transition-colors text-center"><i class="fas fa-notes-medical mr-2 sm:mr-3"></i>Quiz Chirurgia Endocrina</h1>
        <button onclick="toggleDarkMode()" id="theme-toggle" class="mt-3 text-[9px] font-bold text-gray-400 dark:text-gray-500 hover:text-gray-800 dark:hover:text-gray-300 transition-colors uppercase tracking-widest px-4 py-1.5 border border-gray-100 dark:border-white/10 rounded-full flex items-center justify-center gap-2 bg-transparent hover:bg-gray-50 dark:hover:bg-white/5">
            <i class="fas fa-moon" id="theme-icon"></i> <span id="theme-text">Dark Mode</span>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow overflow-y-auto overflow-x-hidden p-4 md:p-8 flex justify-center w-full relative z-0">
        <div class="w-full max-w-3xl h-full flex flex-col py-2 sm:py-4">

            <!-- HOME VIEW -->
            <div id="home-view" class="fade-in flex flex-col h-full justify-between">
                
                <!-- Grafico Andamento -->
                <div class="flex-grow flex flex-col justify-center min-h-[140px] sm:min-h-[160px] relative mb-6 mt-2">
                    <h3 class="text-[9px] font-bold text-gray-300 dark:text-gray-600 uppercase tracking-widest absolute top-0 left-0 transition-colors">Andamento Storico</h3>
                    <div class="relative w-full h-full max-h-[35vh] mt-6">
                        <canvas id="trendChart"></canvas>
                    </div>
                    <div id="no-history-msg" class="hidden absolute inset-0 flex flex-col items-center justify-center text-gray-300 dark:text-gray-700 font-light text-sm transition-colors text-center px-4">
                        <i class="fas fa-chart-line text-2xl mb-2 opacity-30"></i>
                        Inizia un quiz per generare il grafico
                    </div>
                </div>

                <!-- Statistiche Globali -->
                <div class="flex justify-center items-center gap-4 sm:gap-12 md:gap-16 mb-8 transition-colors">
                    <div class="text-center flex flex-col items-center">
                        <span class="text-[7px] font-bold text-gray-400 dark:text-gray-600 uppercase tracking-widest mb-1">Quiz</span>
                        <span class="text-sm sm:text-base font-medium text-gray-800 dark:text-gray-300" id="stat-quizzes">0</span>
                    </div>
                    <div class="w-px h-6 bg-gray-100 dark:bg-white/5"></div>
                    <div class="text-center flex flex-col items-center">
                        <span class="text-[7px] font-bold text-gray-400 dark:text-gray-600 uppercase tracking-widest mb-1">Esatte</span>
                        <span class="text-sm sm:text-base font-medium text-gray-800 dark:text-gray-300" id="stat-accuracy">0%</span>
                    </div>
                    <div class="w-px h-6 bg-gray-100 dark:bg-white/5"></div>
                    <div class="text-center flex flex-col items-center">
                        <span class="text-[7px] font-bold text-gray-400 dark:text-gray-600 uppercase tracking-widest mb-1">Viste</span>
                        <div class="flex items-baseline gap-1">
                            <span class="text-sm sm:text-base font-medium text-gray-800 dark:text-gray-300" id="stat-questions">0</span>
                            <span class="text-[10px] sm:text-[11px] font-light text-gray-400 dark:text-gray-500" id="stat-coverage">0%</span>
                        </div>
                    </div>
                    <div class="w-px h-6 bg-gray-100 dark:bg-white/5"></div>
                    <button onclick="resetData()" class="flex flex-col items-center justify-center text-gray-300 dark:text-gray-700 hover:text-red-500 dark:hover:text-red-500 transition-colors p-2" title="Azzera storico e statistiche">
                        <i class="fas fa-trash-alt text-[12px] sm:mb-0.5"></i>
                    </button>
                </div>

                <!-- Box interattivi: Incolonnati su mobile, affiancati su PC -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6 shrink-0 mt-auto pb-4 md:pb-0">
                    <!-- Nuovo Quiz -->
                    <div class="border-2 border-gray-200 dark:border-white/10 bg-gray-50/30 dark:bg-white/5 rounded-3xl p-5 sm:p-6 flex flex-col justify-between transition-all duration-300 hover:bg-gray-50/80 dark:hover:bg-white/10 hover:border-gray-400 dark:hover:border-white/30">
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-4 sm:mb-6">Nuovo Quiz</span>
                            <div class="flex items-center justify-center mb-6 sm:mb-8">
                                <button onclick="changeNum(-1)" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-gray-800 dark:hover:text-white transition rounded-full hover:bg-gray-100 dark:hover:bg-white/5"><i class="fas fa-minus text-xs"></i></button>
                                <input type="number" id="num-questions" min="1" max="270" value="100" oninput="if(this.value > 270) this.value = 270;" class="w-16 mx-2 text-center bg-transparent text-4xl sm:text-5xl font-light text-gray-800 dark:text-white focus:outline-none border-b border-gray-300 dark:border-white/20 focus:border-gray-500 dark:focus:border-white/50 [-moz-appearance:_textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none transition-colors">
                                <button onclick="changeNum(1)" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-gray-800 dark:hover:text-white transition rounded-full hover:bg-gray-100 dark:hover:bg-white/5"><i class="fas fa-plus text-xs"></i></button>
                            </div>
                        </div>
                        <button onclick="startQuiz('new')" class="w-full bg-gray-900 dark:bg-white hover:bg-black dark:hover:bg-gray-200 text-white dark:text-black text-[10px] sm:text-xs tracking-widest uppercase font-medium py-3.5 sm:py-4 rounded-2xl transition-all duration-300 shadow-sm mt-auto">
                            Avvia
                        </button>
                    </div>

                    <!-- Ripasso Errori -->
                    <div class="border-2 border-red-200 dark:border-red-900/50 bg-red-50/10 dark:bg-red-900/10 rounded-3xl p-5 sm:p-6 flex flex-col justify-between transition-all duration-300 hover:bg-red-50/30 dark:hover:bg-red-900/20 hover:border-red-400 dark:hover:border-red-800">
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] font-bold text-red-400 dark:text-red-500 uppercase tracking-widest mb-4 sm:mb-6 transition-colors">Da Ripassare</span>
                            <div class="text-4xl sm:text-5xl font-light text-red-500 dark:text-red-400 mb-6 sm:mb-8 transition-colors" id="error-count">0</div>
                        </div>
                        <button id="btn-review-errors" onclick="startQuiz('review')" class="w-full bg-red-500 hover:bg-red-600 disabled:bg-gray-100 dark:disabled:bg-black disabled:text-gray-400 dark:disabled:text-gray-600 disabled:border disabled:border-gray-200 dark:disabled:border-white/10 disabled:shadow-none disabled:cursor-not-allowed text-white text-[10px] sm:text-xs tracking-widest uppercase font-medium py-3.5 sm:py-4 rounded-2xl transition-all duration-300 shadow-sm mt-auto">
                            Ripassa
                        </button>
                    </div>
                </div>
            </div>

            <!-- QUIZ VIEW (Responsive: 1 colonna impilata su mobile, 2 colonne su Desktop) -->
            <div id="quiz-view" class="fade-in hidden flex flex-col md:flex-row w-full h-full justify-start items-start gap-4 md:gap-6">
                
                <!-- Colonna Principale: Barra, Domanda, Risposte -->
                <div class="flex-grow flex flex-col min-w-0 w-full">
                    
                    <!-- Header del Quiz e Progress Bar -->
                    <div class="mb-4 sm:mb-6 mt-1 sm:mt-2 shrink-0">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest transition-colors" id="quiz-progress">1 / 20</span>
                            <span class="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest transition-colors" id="score-live">Punti: 0</span>
                        </div>
                        <div class="w-full bg-gray-100 dark:bg-white/5 h-1.5 rounded-full overflow-hidden transition-colors">
                            <div id="progress-bar-fill" class="bg-gray-800 dark:bg-white h-full w-0 transition-all duration-300 ease-out"></div>
                        </div>
                    </div>

                    <!-- Contenitore Animato della Domanda -->
                    <div id="question-anim-container" class="flex-grow flex flex-col justify-start w-full">
                        
                        <div class="mb-6 flex justify-between items-start gap-3 sm:gap-4">
                            <h2 class="text-lg sm:text-xl md:text-2xl font-light text-gray-800 dark:text-white leading-snug transition-colors" id="question-text">Testo domanda</h2>
                            <button id="btn-flag" onclick="toggleFlag()" class="text-gray-300 dark:text-gray-600 hover:text-yellow-400 dark:hover:text-yellow-500 transition-colors text-lg sm:text-xl shrink-0 mt-1 p-2 -mr-2" title="Salva nei dubbi">
                                <i class="fas fa-flag"></i>
                            </button>
                        </div>

                        <div class="space-y-3 mb-6" id="options-container">
                            <!-- Bottoni opzioni via JS -->
                        </div>

                        <!-- Area Feedback (senza scrollbar) -->
                        <div id="feedback-area" class="p-4 sm:p-5 rounded-2xl hidden border-2 transition-all mb-4">
                            <div class="flex items-start">
                                <div id="feedback-icon" class="text-lg mr-3 sm:mr-4 mt-0.5 shrink-0"></div>
                                <div class="flex-grow">
                                    <h3 id="feedback-title" class="text-[10px] font-bold uppercase tracking-widest mb-2"></h3>
                                    <p id="feedback-explanation" class="text-gray-600 dark:text-gray-300 text-xs sm:text-sm font-light leading-relaxed"></p>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                </div>

                <!-- Colonna/Riga Pulsanti -->
                <!-- Su Desktop: A destra, allineato alla barra. Su Mobile: In basso, a tutta larghezza -->
                <div class="shrink-0 flex flex-row md:flex-col justify-end w-full md:w-auto pt-2 md:pt-3.5 pb-8 md:pb-0 gap-3">
                    <button id="btn-next" onclick="nextQuestion()" class="hidden w-full md:w-12 h-12 rounded-xl md:rounded-full bg-gray-900 dark:bg-white hover:bg-black dark:hover:bg-gray-200 text-white dark:text-black flex items-center justify-center transition-all duration-300 shadow-sm" title="Prossima domanda">
                        <span class="md:hidden text-[10px] sm:text-xs tracking-widest uppercase font-medium mr-2">Prossima</span>
                        <i class="fas fa-arrow-right md:text-lg"></i>
                    </button>
                    <button id="btn-finish" onclick="finishQuiz()" class="hidden w-full md:w-12 h-12 rounded-xl md:rounded-full bg-gray-900 dark:bg-white hover:bg-black dark:hover:bg-gray-200 text-white dark:text-black flex items-center justify-center transition-all duration-300 shadow-sm" title="Termina quiz">
                        <span class="md:hidden text-[10px] sm:text-xs tracking-widest uppercase font-medium mr-2">Termina</span>
                        <i class="fas fa-check md:text-lg"></i>
                    </button>
                </div>

            </div>

            <!-- RESULT VIEW -->
            <div id="result-view" class="fade-in hidden flex flex-col h-full justify-center items-center w-full pb-6">
                <div class="text-center mb-8 sm:mb-12 w-full mt-4 sm:mt-0">
                    <h2 class="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-4 transition-colors">Esito Sessione</h2>
                    <div class="text-6xl sm:text-8xl font-light text-gray-800 dark:text-white my-4 sm:my-6 transition-colors" id="final-score-text"></div>
                    <p class="text-xs sm:text-sm font-light text-gray-400 dark:text-gray-500 mt-2 tracking-wide transition-colors" id="final-score-subtext"></p>
                </div>

                <div id="session-errors-container" class="mb-8 sm:mb-10 w-full hidden">
                    <h3 class="text-[10px] font-bold text-red-300 dark:text-red-500 uppercase tracking-widest mb-4 sm:mb-6 border-b border-red-50 dark:border-red-900/30 pb-3 transition-colors">Dettaglio Errori & Dubbi</h3>
                    <div class="space-y-6 max-h-[45vh] overflow-y-auto pr-2 sm:pr-4 scrollbar-thin" id="errors-list">
                        <!-- Popolato via JS -->
                    </div>
                </div>

                <div id="perfect-score-msg" class="mb-8 sm:mb-12 hidden text-center text-green-400 dark:text-green-500 w-full transition-colors">
                    <i class="fas fa-check-circle text-4xl sm:text-5xl mb-4 font-light"></i>
                    <p class="text-xs sm:text-sm font-light tracking-widest uppercase">Nessun Errore</p>
                </div>

                <button onclick="returnToHome()" class="w-full sm:w-auto bg-gray-900 dark:bg-white hover:bg-black dark:hover:bg-gray-200 text-white dark:text-black text-[10px] sm:text-xs tracking-widest uppercase font-medium py-3.5 sm:py-4 px-12 rounded-2xl sm:rounded-xl transition-all duration-300 shadow-sm mt-auto sm:mt-0">
                    Home
                </button>
            </div>

        </div>
    </main>

    <script>
        // IL DATABASE COMPLETO DELLE 260 DOMANDE
        const allQuestions = [
            { id: 1, text: "Sintomi nella sindrome di Zollinger-Ellison", options: ["Esoftalmo, gozzo, ipereccitabilità muscolare", "Ipertensione, cefalea, aritmia", "Asma, diarrea, flushing cutaneo, cisti ossee, calcoli renali, ulcere multiple", "Ipersecrezione acida gastrica, ulcere multiple, diarrea"], correct: 3, explanation: "La Sindrome di Zollinger-Ellison (ZES) è caratterizzata dalla classica triade: tumore secernente gastrina (gastrinoma), ipersecrezione acida gastrica e malattia ulcerosa peptica severa (spesso ulcere multiple e refrattarie), spesso accompagnata da diarrea a causa dell'inattivazione degli enzimi pancreatici per l'eccesso di acido." },
            { id: 2, text: "Nella sindrome di Zollinger-Ellison c'è un eccesso di", options: ["Glucagone", "Insulina", "Serotonina", "Calcitonina", "Gastrina"], correct: 4, explanation: "La base patogenetica della ZES è l'iperproduzione autonoma di gastrina da parte di un tumore neuroendocrino (gastrinoma)." },
            { id: 3, text: "L'area triangolare dove originano i gastrinomi", options: ["Nella coda del pancreas", "Al legamento di Treitz", "Nella testa del pancreas", "Nel corpo del pancreas"], correct: 2, explanation: "L'area a maggior incidenza è il Triangolo del Gastrinoma (o di Passaro), i cui vertici sono: confluenza dotto cistico/coledoco, giunzione D2/D3 del duodeno, e collo/corpo del pancreas. Fino al 90% dei gastrinomi si trova in quest'area (che include testa del pancreas e duodeno)." },
            { id: 4, text: "L'ormone gastrina stimola", options: ["Le cellule G dell'antro gastrico", "Le cellule ossintiche del fondo gastrico", "Le cellule beta del pancreas", "Le cellule alfa del pancreas"], correct: 1, explanation: "La gastrina viaggia nel circolo sanguigno e si lega ai recettori CCK-B sulle cellule parietali (o ossintiche) del fondo e corpo gastrico, stimolando potentemente la secrezione di acido cloridrico." },
            { id: 5, text: "percentuale totale sopravvivenza cancro alla tiroide:", options: ["98%", "75%", "50%", "25%"], correct: 0, explanation: "è tra le domande che ho aggiunto dopo e non ho voglia di cercare una spiegazione. GRAZIE DELLA COMPRENSIONE ♥" },
            { id: 6, text: "Il test di provocazione con calcio e.v. nei carcinoidi", options: ["Non è seguito da alcun effetto", "È seguito dalla morte del paziente", "Aumenta i livelli ematici di serotonina", "Aumenta i livelli ematici di gastrina"], correct: 2, explanation: "L'infusione di calcio stimola in modo esagerato le cellule neuroendocrine tumorali. Nel caso del carcinoide, provoca un picco di rilascio di serotonina (mentre nel gastrinoma causa un picco di gastrina)." },
            { id: 7, text: "Le metastasi epatiche da carcinoide possono essere trattate con", options: ["Resezione epatica", "Termoablazione a radiofrequenza", "Chemioembolizzazione", "Tutte le precedenti"], correct: 3, explanation: "L'approccio alle metastasi epatiche da NET (Tumori Neuroendocrini) è multimodale. Include chirurgia (se resecabili), terapie ablative locali (RFA) e terapie locoregionali come la chemioembolizzazione (TACE) per ridurre la massa e controllare la sindrome ormonale." },
            { id: 8, text: "Le paratiroidi ectopiche possono trovarsi", options: ["Nella lingua", "Nelle labbra", "Nell'osso ioide", "Nel timo"], correct: 3, explanation: "Durante lo sviluppo embriologico, le paratiroidi inferiori (III tasca) migrano verso il basso insieme al timo. Possono fermarsi lungo il tragitto o finire nel mediastino all'interno o in prossimità del timo." },
            { id: 9, text: "Il colore delle paratiroidi è", options: ["Bianco", "Giallo", "Verde", "Rosso", "Blu"], correct: 1, explanation: "Macroscopicamente, le paratiroidi normali hanno un tipico colore giallo-senape o giallo-marrone a causa del loro contenuto di grasso, che aiuta il chirurgo a distinguerle dal tessuto tiroideo (più rosso/carnoso) e dai linfonodi." },
            { id: 10, text: "L'iperparatiroidismo primario può essere dovuto a", options: ["Un singolo adenoma", "Adenomi multipli", "Iperplasia", "Carcinoma", "Tutte le precedenti"], correct: 4, explanation: "L'iperparatiroidismo primario è causato per l'80-85% da un adenoma singolo, 10-15% da iperplasia di tutte e 4 le ghiandole (spesso in contesti MEN), e in meno dell'1% da un carcinoma paratiroideo." },
            { id: 11, text: "Il gastrinoma", options: ["È sempre benigno", "È sempre maligno", "È maligno nel 60% dei casi", "È maligno nel 25% dei casi"], correct: 2, explanation: "Circa il 60-90% dei gastrinomi sono considerati maligni per la loro alta propensione a dare metastasi ai linfonodi locoregionali e al fegato." },
            { id: 12, text: "La zona fascicolata della ghiandola surrenale produce", options: ["Glucocorticoidi", "Mineralcorticoidi", "Ormoni sessuali", "Epinefrina", "Nessuna delle precedenti"], correct: 0, explanation: "La corteccia surrenale si divide in 3 zone (GFR): Glomerulare (Aldosterone/mineralcorticoidi), Fascicolata (Cortisolo/glucocorticoidi), Reticolare (Androgeni/ormoni sessuali)." },
            { id: 13, text: "La midollare della ghiandola surrenale (cellule cromaffini) produce", options: ["Cortisolo e serotonina", "Epinefrina e somatostatina", "Norepinefrina ed epinefrina", "Somatostatina e cortisolo", "Serotonina e norepinefrina"], correct: 2, explanation: "La midollare del surrene è un ganglio simpatico modificato che secerne catecolamine (principalmente epinefrina/adrenalina e, in minor misura, norepinefrina/noradrenalina) nel circolo sistemico." },
            { id: 14, text: "Nel siero dell'iperparatiroidismo primario", options: ["Il calcio è basso, il PTH è elevato", "Il calcio è normale, il PTH è elevato", "Il calcio è elevato, il PTH è elevato", "Il calcio è elevato, il PTH è basso", "Nessuna delle risposte è corretta"], correct: 2, explanation: "Il marker biochimico classico è l'ipercalcemia (dovuta all'eccesso di riassorbimento osseo e renale) associata a un paratormone (PTH) elevato o inappropriatamente normale superiore, poiché la ghiandola tumorale non risponde al feedback negativo del calcio." },
            { id: 15, text: "Nel feocromocitoma il rilascio ormonale è seguito da", options: ["Tachicardia", "Broncocostrizione", "Bradicardia", "Ipoglicemia", "Nessuna delle precedenti"], correct: 0, explanation: "Il rilascio di catecolamine causa iperattivazione simpatica, che si manifesta tipicamente con palpitazioni (tachicardia), ipertensione grave e sudorazione." },
            { id: 16, text: "Erspamer, un candidato al premio Nobel, ha descritto", options: ["La norepinefrina", "L'epinefrina", "La serotonina", "La calcitonina", "La tirosina"], correct: 2, explanation: "Vittorio Erspamer, farmacologo italiano, scoprì e isolò negli anni '30-'40 l'enteramina, che in seguito fu identificata essere la serotonina (5-idrossitriptamina)." },
            { id: 17, text: "Cosa NON è tipico della sindrome da carcinoide", options: ["Diarrea", "Malassorbimento", "Pellagra", "Malformazione della valvola cardiaca sinistra", "Malformazione della valvola cardiaca destra"], correct: 3, explanation: "La cardiopatia da carcinoide colpisce tipicamente il cuore DESTRO (valvola tricuspide e polmonare) perché le sostanze vasoattive vengono inattivate dai polmoni prima di raggiungere il cuore sinistro. Il lato sinistro è coinvolto solo se c'è un difetto del setto (es. forame ovale pervio) o un carcinoide bronchiale." },
            { id: 18, text: "Il segno di Chvostek è provocato da", options: ["Stimolazione del braccio con un ago", "Gonfiaggio di un bracciale pressorio su un braccio", "La manovra di Valsalva", "Percussione della guancia", "Somministrazione di calcio e.v."], correct: 3, explanation: "Il segno di Chvostek è la contrazione dei muscoli facciali provocata dalla percussione del nervo facciale (sulla guancia, davanti al trago) ed è indicativo di ipocalcemia (ipereccitabilità neuromuscolare). Il bracciale pressorio descrive invece il segno di Trousseau." },
            { id: 19, text: "La resezione di un nervo laringeo causa", options: ["Paralisi bilaterale delle corde vocali", "Paralisi omolaterale delle corde vocali", "Paralisi controlaterale delle corde vocali", "Paralisi temporanea delle corde vocali", "Disfagia e broncospasmo"], correct: 1, explanation: "La lesione di un singolo nervo laringeo ricorrente paralizza la corda vocale dello stesso lato (omolaterale), provocando disfonia o voce bitonale." },
            { id: 20, text: "Nella triade di Whipple per l'insulinoma la glicemia è", options: ["< 90 mg/dL", "< 80 mg/dL", "< 70 mg/dL", "< 60 mg/dL", "< 50 mg/dL"], correct: 4, explanation: "La Triade di Whipple richiede: 1) Sintomi di ipoglicemia a digiuno o post-esercizio; 2) Glicemia documentata bassa (generalmente < 50 mg/dL) durante i sintomi; 3) Sollievo dai sintomi dopo somministrazione di glucosio." },
            { id: 21, text: "Nella triade di Whipple per l'insulinoma c'è", options: ["I sintomi sono ridotti dal glucosio e.v.", "Diarrea e malassorbimento", "Cefalea e ipertensione", "Coma e morte", "Nessuna delle precedenti"], correct: 0, explanation: "Il third elemento della triade di Whipple è la risoluzione immediata dei sintomi neuroglicopenici o simpaticomimetici in seguito alla somministrazione di glucosio (es. zolletta di zucchero o glucosio e.v.)." },
            { id: 22, text: "Qual è l'attuale tendenza epidemiologica dell'incidenza del tumore alla tiroide in Italia?", options: ["È tra le più basse al mondo", "È in costante aumento, in gran parte per la diagnosi precoce di microcarcinomi", "È in rapida diminuzione grazie alla iodoprofilassi", "È stabile ma colpisce esclusivamente i maschi"], correct: 1, explanation: "L'incidenza in Italia è tra le più alte a livello globale ed è in costante aumento da decenni. Gran parte di questo incremento è attribuibile alla 'sovradiagnosi', ovvero il frequente riscontro ecografico occasionale di piccoli carcinomi papillari indolenti (microcarcinomi)." },
            { id: 23, text: "In relazione alla ghiandola tiroidea il nervo laringeo ricorrente è vicino al", options: ["Polo superiore", "Istmo tiroideo", "Arteria tiroidea superiore", "Arteria tiroidea inferiore", "Nessuna delle precedenti"], correct: 3, explanation: "Anatomicamente, il nervo laringeo ricorrente incrocia (o passa molto vicino) i rami dell'arteria tiroidea inferiore vicino al polo inferiore della tiroide e nel solco tracheoesofageo. Questo è un punto critico in chirurgia." },
            { id: 24, text: "In Italia qual è stato l'effetto del disastro di Chernobyl sull'incidenza dei tumori alla tiroide", options: ["Terribile", "Un aumento rapido e consistente", "Nessun aumento", "Una riduzione", "L'Italia non è stata minimamente coinvolta"], correct: 2, explanation: "Sebbene Chernobyl abbia causato un forte aumento dei carcinomi papillari pediatrici nelle aree limitrofe all'esplosione (Bielorussia, Ucraina), in Italia l'esposizione allo Iodio-131 non è stata sufficiente a causare un aumento statisticamente rilevabile a livello epidemiologico." },
            { id: 25, text: "Il tumore anaplastico della tiroide", options: ["È il tumore tiroideo più frequente", "Appare come un'area calda alla scintigrafia", "Modifica presto i parametri funzionali", "Le cellule tumorali sono indifferenziate", "Nessuna delle precedenti"], correct: 3, explanation: "Il carcinoma anaplastico è caratterizzato da cellule totalmente indifferenziate che non somigliano più ai tireociti, non captano iodio e crescono in modo estremamente aggressivo." },
            { id: 26, text: "Il tumore midollare della tiroide", options: ["Produce calcitonina", "Produce serotonina", "Non è mai bilaterale", "È un componente della MEN 1", "Entrambe le risposte c e d sono corrette"], correct: 0, explanation: "Il carcinoma midollare origina dalle cellule C parafollicolari (derivate dalla cresta neurale) che secernono calcitonina. È associato alla MEN 2, non alla MEN 1." },
            { id: 27, text: "Sede del carcinoide con il tasso più alto di sindrome da carcinoide", options: ["Retto", "Colon", "Appendice", "Diverticolo di Meckel", "Digiuno - ileo"], correct: 4, explanation: "I carcinoidi dell'intestino medio (digiuno, ileo, tenue) sono quelli che più frequentemente metastatizzano al fegato. La sindrome compare quasi esclusivamente quando ci sono metastasi epatiche (che bypassano il filtro epatico), quindi il tenue ha il tasso più alto associato alla sindrome." },
            { id: 28, text: "La vena surrenalica destra confluisce in", options: ["Vena cava inferiore", "Vena renale destra", "Vene diaframmatiche", "Vena mesenterica superiore", "Nessuna delle precedenti"], correct: 0, explanation: "La vena surrenalica destra è molto corta e drena direttamente nella vena cava inferiore, rendendo la surrenalectomia destra tecnicamente delicata. La sinistra drena invece nella vena renale sinistra." },
            { id: 29, text: "Le cellule del carcinoide derivano da", options: ["Cellule ossintiche", "Cellule enterocromaffini", "Cellule delta pancreatiche", "Cellule di un carcinoma", "Cellule di un adenocarcinoma"], correct: 1, explanation: "I tumori carcinoidi originano dalle cellule enterocromaffini (cellule di Kulchitsky) diffuse nel tratto gastrointestinale e polmonare, che fanno parte del sistema APUD/neuroendocrino." },
            { id: 30, text: "I carcinoidi producono principalmente", options: ["Epinefrina", "Gastrina", "Somatostatina", "Serotonina", "Istamina"], correct: 3, explanation: "Sebbene possano produrre vari peptidi, il prodotto di secrezione di gran lunga più caratteristico e clinicamente rilevante (causa della sindrome da carcinoide) è la serotonina (5-HT)." },
            { id: 31, text: "Le 3 sedi più frequenti di carcinoidi sono", options: ["Appendice, ileo, retto", "Pancreas, stomaco, duodeno", "Colon, diverticolo di Meckel, digiuno", "Esofago, stomaco, vie biliari", "Polmoni, appendice, vie biliari"], correct: 0, explanation: "Nel tratto gastrointestinale, la maggior parte dei carcinoidi si localizza in appendice, tenue (ileo) e retto." },
            { id: 32, text: "La serotonina deriva metabolicamente da", options: ["Tirosina", "Leucina", "Isoleucina", "Triptofano", "Alanina"], correct: 3, explanation: "La serotonina (5-idrossitriptamina) è sintetizzata a partire dall'aminoacido essenziale triptofano. Un eccessivo consumo di triptofano da parte del tumore può causare carenza di niacina e portare a pellagra." },
            { id: 33, text: "La serotonina è catabolizzata principalmente da", options: ["Rene", "Fegato", "Pancreas", "Intestino", "Cervello"], correct: 1, explanation: "La serotonina secreta nel circolo portale viene fisiologicamente inattivata (catabolizzata in 5-HIAA) dalle monoamino-ossidasi (MAO) nel fegato. Ecco perché la sindrome sistemica compare solo quando le metastasi epatiche riversano serotonina direttamente nelle vene sovraepatiche." },
            { id: 34, text: "Il colore dei carcinoidi è", options: ["Rosso scuro", "Verde", "Giallo", "Nero", "Blu"], correct: 2, explanation: "Macroscopicamente, all'apertura della mucosa intestinale, i tumori carcinoidi appaiono tipicamente come piccoli noduli sottomucosi di colore giallo o giallo-grigiastro." },
            { id: 35, text: "Il potenziale maligno dei carcinoidi dipende da", options: ["Sede", "Dimensioni", "Profondità di penetrazione nella parete", "Contenuto cellulare di DNA", "Tutte le precedenti"], correct: 4, explanation: "Il rischio di metastasi dipende dalla sede di origine (es. appendice è spesso benigna, ileo è più aggressivo), dalle dimensioni (>2 cm alto rischio), dall'infiltrazione della muscolare e dai marker di proliferazione." },
            { id: 36, text: "Utile per la diagnosi di feocromocitoma", options: ["Tasso ematico di 5-OH triptamina", "Tasso di acido vanilmandelico urinario", "Tasso di 5-HIAA urinario", "Tasso ematico di calcitonina", "Nessuna delle precedenti"], correct: 1, explanation: "La diagnosi si fa dosando le catecolamine e i loro metaboliti. L'acido vanilmandelico (VMA) e le metanefrine nelle urine delle 24h sono i test standard." },
            { id: 37, text: "Il feocromocitoma ectopico ha origine in", options: ["Ovaie", "Testicoli", "Vescica", "Fegato"], correct: 2, explanation: "I feocromocitomi extra-surrenalici sono chiamati paragangliomi. Una sede rara ma tipica (che causa ipertensione parossistica durante la minzione) è la parete della vescica urinaria." },
            { id: 38, text: "Il precursore dell'epinefrina è", options: ["Triptofano", "Tirosina", "Leucina", "Alanina", "Isoleucina"], correct: 1, explanation: "La sintesi delle catecolamine segue la via: Tirosina -> DOPA -> Dopamina -> Norepinefrina -> Epinefrina." },
            
            { id: 39, text: "Cos'è la Pseudo-ZES (Sindrome di Zollinger-Ellison)?", options: ["Un adenoma ipofisario secernente ACTH", "Iperplasia delle cellule G", "Un tumore carcinoide del duodeno", "Iperplasia delle cellule D pancreatiche"], correct: 1, explanation: "La Pseudo-ZES è caratterizzata da un'iperplasia delle cellule G dell'antro gastrico che producono un eccesso di gastrina, simulando clinicamente la vera ZES (che è invece causata da un gastrinoma tumorale)." },
            { id: 40, text: "Che cos'è l'Acido Vanilmandelico (VMA)?", options: ["Un metabolita della serotonina", "Un precursore della calcitonina", "Un metabolita delle catecolamine", "Un ormone steroideo"], correct: 2, explanation: "L'acido vanilmandelico è il prodotto finale del metabolismo delle catecolamine (epinefrina e norepinefrina) e viene dosato nelle urine per la diagnosi di feocromocitoma." },
            { id: 41, text: "Dove drena anatomicamente la Vena Surrenalica Sinistra?", options: ["Direttamente nella vena cava inferiore", "Nella vena renale sinistra (spesso unendosi alla vena frenica inferiore)", "Nella vena mesenterica superiore", "Nella vena porta"], correct: 1, explanation: "A differenza della vena surrenalica destra che drena in modo brevissimo e diretto nella vena cava inferiore, la vena surrenalica sinistra è più lunga e drena nella vena renale sinistra, ricevendo spesso il sangue dalla vena frenica inferiore sinistra." },
            { id: 42, text: "Qual è il principale metabolita della serotonina?", options: ["Acido vanilmandelico (VMA)", "Metanefrina", "5-HIAA (Acido 5-idrossiindolacetico)", "Dopamina"], correct: 2, explanation: "La serotonina viene catabolizzata dalle MAO in acido 5-idrossiindolacetico (5-HIAA), che viene misurato nelle urine delle 24 ore per diagnosticare i tumori carcinoidi." },
            { id: 43, text: "Qual è la causa più frequente di ipercalcemia?", options: ["Ipertiroidismo", "Iperparatiroidismo", "Feocromocitoma", "Metastasi ossee litiche"], correct: 1, explanation: "Nella popolazione generale e ambulatoriale, l'iperparatiroidismo primario è la causa più comune di ipercalcemia. Nei pazienti ospedalizzati, l'ipercalcemia neoplastica è più frequente." },
            { id: 44, text: "Come sono i livelli di calcio nell'iperparatiroidismo primario e terziario?", options: ["Ridotti (ipocalcemia)", "Aumentati (ipercalcemia)", "Normali", "Fluttuanti"], correct: 1, explanation: "Sia nel primario (adenoma autonomo) che nel terziario (iperplasia autonoma post-insufficienza renale prolungata), la secrezione sregolata di PTH causa ipercalcemia." },
            { id: 45, text: "Qual è la classica triade sintomatologica del feocromocitoma?", options: ["Ipotensione, letargia, ipoglicemia", "Ipertensione, sudorazione, iperglicemia", "Esoftalmo, tachicardia, tremori", "Diarrea, vampate cutanee, asma"], correct: 1, explanation: "I sintomi derivano dall'eccesso di catecolamine simpatiche: ipertensione (spesso parossistica), sudorazione profusa, cefalea, palpitazioni, e un'azione controinsulare che porta a iperglicemia." },
            { id: 46, text: "Quali sono i sintomi classici della sindrome da carcinoide (eccesso di serotonina)?", options: ["Ipertensione, cefalea, sudorazione", "Ulcere multiple, ipersecrezione acida, diarrea", "Diarrea, asma, eruzioni cutanee (flushing), valvulopatia", "Tetania, parestesie, convulsioni"], correct: 2, explanation: "Il rilascio di sostanze vasoattive (serotonina, istamina) causa vampate al volto (flushing), diarrea secretoria, broncospasmo (asma) e fibrosi del cuore destro (valvulopatia)." },
            { id: 47, text: "Cosa causa la pellagra nei pazienti con sindrome da carcinoide severa?", options: ["Mancanza di vitamina B12", "Eccessiva distruzione dei globuli rossi", "Mancanza di triptofano (alterazione del metabolismo proteico)", "Eccesso di acido gastrico"], correct: 2, explanation: "Il tumore consuma massicce quantità di triptofano per sintetizzare serotonina, deprivando l'organismo di questo aminoacido necessario per la sintesi della Niacina (Vitamina B3), sfociando nella Pellagra (Dermatite, Diarrea, Demenza)." },
            { id: 48, text: "Quali sono due effetti fisiologici dell'epinefrina?", options: ["Assorbimento di calcio renale e riduzione frequenza cardiaca", "Rilascio di glucosio, aumento della frequenza cardiaca", "Secrezione acida gastrica e vasodilatazione cutanea", "Aumento della motilità intestinale e broncocostrizione"], correct: 1, explanation: "L'epinefrina (adrenalina) è l'ormone del 'fight or flight': aumenta la gittata e frequenza cardiaca, e mobilita le riserve energetiche inducendo glicogenolisi (rilascio di glucosio)." },
            { id: 49, text: "Come si chiama un tumore originato dalle cellule beta pancreatiche?", options: ["Glucagonoma", "Gastrinoma", "Vipoma", "Insulinoma"], correct: 3, explanation: "Le cellule beta delle Isole di Langerhans secernono insulina. Un loro tumore ipersecernente è l'insulinoma, che causa ipoglicemia a digiuno." },
            { id: 50, text: "Cosa è necessario fare PRIMA o DURANTE la surrenalectomia per feocromocitoma?", options: ["Somministrare cortisolo a dosi massicce e chiudere la vena porta", "Chiudere la vena cava inferiore, somministrare alfa/beta bloccanti e sale", "Eseguire una termoablazione a radiofrequenza preventiva", "Nessuna preparazione farmacologica è necessaria"], correct: 1, explanation: "La gestione anestesiologica e chirurgica è vitale. Si pre-tratta il paziente con alfa-bloccanti, fluidi e sale per espandere il volume plasmatico e prevenire crisi ipertensive e successiva grave ipotensione. Chirurgicamente, bisogna controllare l'efflusso venoso per evitare massicce scariche catecolaminiche durante la manipolazione." },
            { id: 51, text: "Qual è l'origine embriologica delle paratiroidi?", options: ["Inf: II tasca faringea. Sup: III tasca", "Inf: IV tasca faringea. Sup: III tasca", "Inf: III tasca faringea. Sup: IV tasca", "Derivano dalla fessura brachiale"], correct: 2, explanation: "Controintuitivamente, le paratiroidi INFERIORI derivano dalla TERZA tasca (e migrano giù con il timo), mentre le SUPERIORI derivano dalla QUARTA tasca faringea (e migrano poco, rimanendo più in alto)." },
            { id: 52, text: "Cosa secernono i gastrinomi?", options: ["Glucagone", "Insulina", "Gastrina", "Somatostatina"], correct: 2, explanation: "I gastrinomi secernono autonomamente l'ormone gastrina, che iperstimola lo stomaco a produrre acido cloridrico." },
            { id: 53, text: "Quale grave complicanza cardiaca cronica si sviluppa tipicamente nei pazienti con sindrome da carcinoide prolungata?", options: ["Endocardite infettiva della valvola mitrale", "Cardiomiopatia ipertrofica ventricolare sinistra", "Fibrosi e insufficienza delle valvole del cuore destro (es. tricuspide)", "Aneurisma dell'aorta ascendente"], correct: 2, explanation: "L'esposizione prolungata e non trattata ad alti livelli di serotonina circolante causa la deposizione di placche fibrotiche sull'endocardio e sulle valvole del cuore destro (valvola tricuspide e polmonare), portando alla tipica 'cardiopatia da carcinoide'." },
            { id: 54, text: "Cosa causa la sindrome da carcinoide?", options: ["Ipersecrezione di insulina", "Ipersecrezione di gastrina", "Ipersecrezione di serotonina", "Ipersecrezione di catecolamine"], correct: 2, explanation: "L'ingresso massiccio di mediatori vasoattivi, primariamente la serotonina, nel circolo sistemico è la causa fisiopatologica della sindrome." },
            { id: 55, text: "Quale colorazione istologica è tipica per le cellule cromaffini?", options: ["Argento", "Rosso Congo", "Cromo", "Ematossilina-Eosina pura"], correct: 2, explanation: "Le cellule della midollare surrenale (e dei paragangliomi) prendono il nome di 'cromaffini' perché il loro citoplasma contenente catecolamine si colora di scuro in presenza di sali di Cromo (reazione cromaffine)." },
            { id: 56, text: "Quale colorazione istologica è usata storicamente per le cellule carcinoidi?", options: ["Cromo", "Argento", "Blu di Prussia", "PAS"], correct: 1, explanation: "Le cellule dei tumori neuroendocrini/carcinoidi hanno la capacità di ridurre i sali d'argento, da cui le classiche tecniche istochimiche argentaffini o argirofile." },
            { id: 57, text: "Quando è stato scoperto il cortisolo per la prima volta?", options: ["1890", "1922", "1950", "1975"], correct: 2, explanation: "La scoperta e sintesi del cortisone e dell'idrocortisone (cortisolo) fruttò il Premio Nobel per la Medicina nel 1950 a Kendall, Reichstein e Hench." },
            { id: 58, text: "Qual è l'incidenza stimata globale dei Tumori Neuroendocrini (NET)?", options: ["1 caso su 1.000.000 di persone ogni anno", "2-5 casi su 100.000 persone ogni anno", "50 casi su 100.000 persone ogni anno", "100 casi su 100.000 persone ogni anno"], correct: 1, explanation: "I NET sono tumori relativamente rari, con un'incidenza di circa 2-5 casi ogni 100.000 abitanti all'anno, anche se in aumento grazie a diagnosi migliori." },
            { id: 59, text: "Qual è l'incidenza dei tumori carcinoidi?", options: ["1 caso su 100.000 persone ogni anno", "10 casi su 100.000 persone ogni anno", "1 caso su 1.000.000 di persone ogni anno", "50 casi su 100.000 persone ogni anno"], correct: 0, explanation: "Secondo il testo di riferimento originario, l'incidenza specifica dei classici carcinoidi si attesta su circa 1 caso ogni 100.000 persone all'anno." },
            { id: 60, text: "Cosa producono le cellule alfa pancreatiche?", options: ["Insulina", "Glucagone", "Somatostatina", "Polipeptide pancreatico (PP)"], correct: 1, explanation: "Le cellule alfa secernono glucagone, ormone iperglicemizzante che agisce in antagonismo all'insulina prodotta dalle beta." },
            { id: 61, text: "Da quale struttura origina il feocromocitoma?", options: ["Corticale del surrene", "Midollare del surrene (cellule cromaffini)", "Tiroide", "Paratiroidi"], correct: 1, explanation: "Il feocromocitoma è il tumore neuroendocrino che origina specificamente dalle cellule cromaffini della parte interna (midollare) del surrene." },
            { id: 62, text: "Cosa secernono le cellule delta del pancreas?", options: ["Glucagone", "Insulina", "Gastrina", "Somatostatina"], correct: 3, explanation: "Le cellule delta secernono somatostatina, un potente ormone inibitorio universale che rallenta la motilità gastrointestinale e inibisce il rilascio di molti altri ormoni." },
            { id: 63, text: "Il surrene possiede una ricca vascolarizzazione. In particolare, le arterie surrenaliche inferiori da quale vaso traggono tipicamente origine?", options: ["Dall'arteria mesenterica superiore", "Dall'arteria renale omolaterale", "Direttamente dal tronco celiaco", "Dall'arteria iliaca comune"], correct: 1, explanation: "Il surrene è irrorato da tre gruppi arteriosi: le superiori (dalle arterie freniche inferiori), le medie (dall'aorta addominale) e le inferiori (che nascono tipicamente dall'arteria renale corrispondente)." },
            { id: 64, text: "Quali sono le funzioni del Paratormone (PTH)?", options: ["Abbassa il calcio depositandolo nelle ossa", "Agisce sulla vit. D3 per l'assorbimento intestinale, stimola gli osteoclasti, migliora riassorbimento di calcio nel rene", "Inibisce l'assorbimento renale di calcio e stimola gli osteoblasti", "Nessuna delle precedenti"], correct: 1, explanation: "Il PTH alza la calcemia in 3 modi: 1) attiva la vitamina D nel rene, 2) riassorbe calcio dall'osso via osteoclasti, 3) recupera calcio e magnesio dall'urina nel tubulo contorto distale." },
            { id: 65, text: "Sede più tipica delle metastasi da carcinoidi", options: ["Ossa e cervello", "Linfonodi ascellari", "Fegato, polmoni", "Rene e milza"], correct: 2, explanation: "Avendo origine frequente dal tratto GI, il drenaggio venoso portale trasporta le cellule metastatiche prima di tutto al Fegato. I carcinoidi polmonari o rettali possono metastatizzare direttamente ai Polmoni." },
            { id: 66, text: "Quale NON è una causa di iperparatiroidismo primario?", options: ["Adenoma singolo", "Iperplasia ghiandolare", "Carcinoma paratiroideo", "Linfoma"], correct: 3, explanation: "Il linfoma non fa parte dell'eziologia dell'iperparatiroidismo primario. Quest'ultimo è una patologia proliferativa intrinseca del parenchima paratiroideo (adenoma 80%, iperplasia, carcinoma)." },
            { id: 67, text: "Nella Sindrome di Zollinger-Ellison (ZES), l'eccesso di gastrina su quali cellule agisce per causare il quadro clinico?", options: ["Sulle cellule G dell'antro gastrico", "Sulle cellule alfa delle isole pancreatiche", "Sulle cellule ossintiche (parietali) dello stomaco", "Sulle cellule mucipare del duodeno"], correct: 2, explanation: "Il gastrinoma produce massicce quantità di gastrina che, viaggiando nel torrente ematico, va a iperstimolare i recettori CCK-B sulle cellule parietali (ossintiche) situate nel fondo e nel corpo dello stomaco, provocando un'ipersecrezione acida refrattaria." },
            { id: 68, text: "Quali di queste cellule derivano dalla cresta neurale?", options: ["Solo gli epatociti", "Cellule muscolari striate", "Cellule cromaffini, melanociti, cartilagine cranio-facciale, glia periferica ed enterica", "Solo gli eritrociti"], correct: 2, explanation: "La cresta neurale embriologica è una struttura transitoria che dà origine a una vasta gamma di cellule, incluso tutto il sistema neuroendocrino diffuso, midollare surrenalica e sistema nervoso autonomo." },
            { id: 69, text: "Cos'è la Sindrome MEN 1 (Sindrome di Wermer)?", options: ["Associa midollare tiroide e feocromocitoma", "Sviluppo di lesioni neoplastiche nell'ipofisi, paratiroidi e pancreas", "Malattia autoimmune della tiroide", "Sindrome che causa ipocalcemia severa"], correct: 1, explanation: "La MEN 1 (Mutazione Menina) colpisce le 3 P: Pituitary (Ipofisi), Paratiroidi (iperparatiroidismo è quasi costante), e Pancreas endocrino (Gastrinomi, Insulinomi)." },
            { id: 70, text: "Quali patologie sono associate alla Sindrome MEN 2?", options: ["Adenomi ipofisari e gastrinomi", "Carcinoma papillare della tiroide e linfomi", "Carcinoma midollare della tiroide, feocromocitoma, e (nella 2A) iperparatiroidismo", "Solo carcinoidi intestinali multipli"], correct: 2, explanation: "MEN 2 (mutazione gene RET) prevede sempre il Carcinoma Midollare della Tiroide (100%), spesso Feocromocitoma (50%), associato a iperparatiroidismo (MEN 2A) o a ganglioneuromatosi/habitus marfanoide (MEN 2B)." },
            { id: 71, text: "Qual è l'incidenza dei paragangliomi?", options: ["10 casi su 100.000 persone ogni anno", "1-2 casi su 100.000 persone ogni anno", "0.1 casi su 100.000 persone ogni anno", "20 casi su 100.000 persone ogni anno"], correct: 1, explanation: "I paragangliomi (feocromocitomi extra-surrenalici lungo i gangli simpatici o parasimpatici) sono rari, stimati in 1-2 casi per 100.000 abitanti." },
            { id: 72, text: "In che percentuale il feocromocitoma è maligno?", options: ["10% dei casi", "50% dei casi", "90% dei casi", "0% (sempre benigno)"], correct: 0, explanation: "Il feocromocitoma è famoso per la 'regola del 10': 10% extra-surrenalico, 10% bilaterale, 10% familiare, 10% pediatrico e 10% maligno (definito dalla presenza di metastasi)." },
            { id: 73, text: "Quali vene formano principalmente la vena porta?", options: ["Vena cava inferiore, vene epatiche di destra e sinistra, e i rami provenienti dalle vene renali", "Vena iliaca comune destra e sinistra, in confluenza con la vena sacrale mediana e le vene lombari", "Vena mesenterica superiore unita alla vena splenica (che accoglie l'inferiore), vene gastriche e cistiche", "Vena mesenterica inferiore unita direttamente alla vena cava inferiore, insieme alle vene polmonari"], correct: 2, explanation: "Il tronco della vena porta si forma dietro il collo del pancreas dalla confluenza della Vena Mesenterica Superiore e del Tronco Spleno-Mesenterico (Vena Splenica unita alla Vena Mesenterica Inferiore)." },
            { id: 74, text: "Quali sono i prodotti della corticale del surrene?", options: ["Catecolamine", "Androgeni, glucocorticoidi, mineralcorticoidi", "Insulina e Glucagone", "Calcitonina e PTH"], correct: 1, explanation: "Ricorda la mnemotecnica: 'Sale, Zucchero, Sesso'. Glomerulare = Mineralcorticoidi (Aldosterone per il sale), Fascicolata = Glucocorticoidi (Cortisolo per zuccheri), Reticolare = Androgeni (DHEA per caratteri sessuali)." },
            { id: 75, text: "Qual è l'incidenza del paraganglioma aortico (Organo di Zuckerkandl)?", options: ["10 casi su 100.000 persone ogni anno", "1 caso su 100.000 persone ogni anno", "1 caso su 1.000.000 di persone ogni anno", "Nessuna delle precedenti"], correct: 1, explanation: "Il paraganglioma aortico, localizzato alla biforcazione dell'aorta (Organo di Zuckerkandl), è il paraganglioma addominale più frequente ma resta raro, con un'incidenza di circa 1:100.000." },
            
            { id: 76, text: "Quale dei seguenti elenchi rappresenta in modo più completo la sintomatologia del feocromocitoma?", options: ["Ipotensione, diarrea, letargia, bradicardia", "Ipertensione, sudorazione, costipazione, sintomi psichici, tachicardia, iperglicemia", "Asma, flushing cutaneo, valvulopatia destra, pellagra", "Obesità centripeta, strie rubre, astenia, irsutismo"], correct: 1, explanation: "Oltre alla classica triade (ipertensione, sudorazione, tachicardia), l'eccesso di catecolamine riduce la motilità intestinale (costipazione), altera il metabolismo glucidico (iperglicemia) e può causare gravi stati d'ansia o alterazioni dell'umore (sintomi psichici)." },
            { id: 77, text: "Dal punto di vista fisiopatologico, cosa è strettamente necessario affinché un carcinoide del tratto gastrointestinale provochi la \"sindrome da carcinoide\" sistemica?", options: ["Che il tumore infiltri la muscolaris mucosae", "La presenza di metastasi polmonari", "Un'insufficienza epatica o metastasi epatiche che bypassino il fegato", "La secrezione concomitante di gastrina"], correct: 2, explanation: "Il fegato sano metabolizza rapidamente la serotonina prodotta nell'intestino grazie alle MAO. La sindrome ormonale sistemica si manifesta solo quando questo filtro viene bypassato dalle metastasi epatiche (che rilasciano l'ormone direttamente nelle vene sovraepatiche) o in caso di insufficienza epatica." },
            { id: 78, text: "Qual è il sito principale di ectopia per le ghiandole paratiroidi inferiori?", options: ["Lobo epatico destro", "Nel timo o nel mediastino anteriore", "Alla base della lingua", "Nella ghiandola sottomandibolare"], correct: 1, explanation: "Le paratiroidi inferiori derivano dalla III tasca faringea e migrano in basso insieme al timo. Possono fermarsi lungo il tragitto cervicale inferiore o finire ectopicamente nel mediastino anteriore (spesso all'interno del corno timico)." },
            { id: 79, text: "Di quali molecole specifiche l'Acido Vanilmandelico (VMA) è il principale metabolita finale?", options: ["Serotonina e Istamina", "Calcitonina e Paratormone", "Noradrenalina e Adrenalina", "Acetilcolina e Dopamina"], correct: 2, explanation: "L'acido vanilmandelico (VMA) è il prodotto terminale della via catabolica delle catecolamine (noradrenalina e adrenalina), degradate dagli enzimi COMT e MAO." },
            { id: 80, text: "Come viene escreto dal corpo l'acido vanilmandelico (VMA) a fini di misurazione diagnostica?", options: ["Attraverso la bile nelle feci", "Con la sudorazione e la saliva", "Tramite l'espirazione polmonare", "Principalmente con le urine"], correct: 3, explanation: "Il VMA, essendo un metabolita idrosolubile inerte, viene filtrato dai reni ed escreto. Per diagnosticare un feocromocitoma si valuta la sua concentrazione mediante la raccolta delle urine delle 24 ore." },
            { id: 81, text: "Qual è la prevalenza stimata del tumore carcinoide secondo alcuni dati epidemiologici di riferimento?", options: ["20 casi su 100.000 persone", "2 casi su 100.000 persone", "1 caso su 1.000.000 di persone", "50 casi su 100.000 persone"], correct: 1, explanation: "Il carcinoide è una patologia neoplastica rara; sebbene ci siano lievi discrepanze nei testi tra incidenza e prevalenza globale, dati specifici riportano una prevalenza media di circa 2 casi su 100.000 abitanti." },
            { id: 82, text: "In quale contesto clinico-genetico è possibile riscontrare frequentemente l'associazione tra un tumore carcinoide (es. timico, bronchiale) e un quadro di iperparatiroidismo?", options: ["Sindrome MEN 1 (Sindrome di Wermer)", "Sindrome MEN 2A (Sindrome di Sipple)", "Sindrome di Zollinger-Ellison isolata", "Malattia di Cushing"], correct: 0, explanation: "La MEN 1, oltre a colpire Paratiroidi, Pancreas e Ipofisi (le 3 P), si associa con frequenza aumentata a tumori carcinoidi del tratto foregut (timo, bronchi, stomaco). Esiste anche la rara secrezione paraneoplastica di PTH-rP da parte dei carcinoidi." },
            { id: 83, text: "Qual è la percentuale di incidenza epidemiologica annuale dei tumori neuroendocrini (NET) nel loro complesso?", options: ["0.5 casi per 100.000 persone ogni anno", "2-3 casi per 100.000 persone ogni anno", "10-15 casi per 100.000 persone ogni anno", "Più di 50 casi per 100.000 persone ogni anno"], correct: 1, explanation: "I tumori neuroendocrini (NET) sono considerati rari, con un'incidenza annua globale stimata attorno ai 2-3 casi per 100.000 persone all'anno, comprendendo tutte le localizzazioni gastroenteropancreatiche (GEP) e polmonari." },
            { id: 84, text: "Sindrome da carcinoide, quale di questi è un sintomo clinico primario?", options: ["Stipsi severa", "Diarrea", "Ritenzione urinaria", "Ipotensione ortostatica"], correct: 1, explanation: "La diarrea secretoria è uno dei sintomi più frequenti e debilitanti della sindrome da carcinoide, causata dall'eccesso di serotonina che stimola la motilità e la secrezione intestinale." },
            { id: 85, text: "Da cosa è causata l'ipercalcemia nell'IPTP (Iperparatiroidismo Primario)?", options: ["Solo da adenoma", "Solo da carcinoma", "Solo da iperplasia", "Adenoma, carcinoma, iperplasia, tutte le precedenti"], correct: 3, explanation: "L'iperparatiroidismo primario (IPTP) può essere causato da un adenoma singolo (più frequente), iperplasia di più ghiandole, o raramente da un carcinoma paratiroideo." },
            { id: 86, text: "Cosa è incluso all'interno del triangolo del gastrinoma?", options: ["Coda del pancreas", "Testa del pancreas", "Milza", "Fegato"], correct: 1, explanation: "Il triangolo del gastrinoma (o di Passaro) comprende la confluenza biliare, il duodeno e il collo/corpo del pancreas, includendo al interno la testa del pancreas, sede frequente di queste neoplasie." },
            { id: 87, text: "Qual è uno degli effetti metabolici diretti dell'adrenalina?", options: ["Smobilita le riserve di glucosio", "Promuove la sintesi di glicogeno", "Riduce la frequenza cardiaca", "Stimola la secrezione di insulina"], correct: 0, explanation: "L'adrenalina (o epinefrina) prepara il corpo alla reazione 'fight or flight', smobilitando le riserve di glucosio (glicogenolisi) per fornire energia immediata ai muscoli e al cervello." },
            { id: 88, text: "Cosa è solitamente necessario perché la sindrome da carcinoide diventi sintomatica a livello sistemico?", options: ["Ulcera gastrica perforata", "Insufficienza epatica (o metastasi epatiche)", "Metastasi cerebrali", "Ostruzione intestinale"], correct: 1, explanation: "Affinché i mediatori vasoattivi come la serotonina raggiungano il circolo sistemico senza essere inattivati, è necessaria la presenza di metastasi epatiche (che bypassano il filtro del fegato) o un grave stato di insufficienza epatica." },
            { id: 89, text: "Qual è il sito di ectopia principale in cui è possibile ritrovare una paratiroide inferiore?", options: ["Muscolo sternocleidomastoideo", "Timo", "Lobo epatico", "Esofago"], correct: 1, explanation: "Le paratiroidi inferiori condividono l'origine embriologica (terza tasca faringea) con il timo e migrano con esso, potendo rimanere intrappolate nel mediastino o all'interno del timo stesso." },
            { id: 90, text: "Cosa stimola direttamente la gastrina?", options: ["Secrezione di insulina", "Secrezione di glucagone", "Secrezione di bile", "Secrezione di HCl (acido cloridrico)"], correct: 3, explanation: "La gastrina agisce sulle cellule parietali (ossintiche) dello stomaco, stimolandole potentemente a produrre e secernere acido cloridrico (HCl)." },
            { id: 91, text: "Quali sono manifestazioni cliniche tipiche della sindrome di Zollinger Ellison?", options: ["Diarrea da malassorbimento e ulcere gastriche/peptiche", "Stipsi e calcoli biliari", "Iperglicemia e obesità", "Ipotensione e bradicardia"], correct: 0, explanation: "L'eccesso di acido cloridrico non solo causa ulcere gastriche e duodenali refrattarie, ma inattiva anche gli enzimi pancreatici, portando a maldigestione e diarrea da malassorbimento." },
            { id: 92, text: "Dove drena la vena surrenalica destra rispetto a quella sinistra?", options: ["Direttamente nella vena cava inferiore", "Nella vena renale destra", "Nella vena porta", "Nella vena mesenterica superiore"], correct: 0, explanation: "La vena surrenalica destra è cortissima e sfocia direttamente nella vena cava inferiore, mentre la sinistra drena nella vena renale sinistra. Questo rende la surrenectomia destra più rischiosa." },
            { id: 93, text: "Se si esegue una surrenectomia per feocromocitoma, qual è il primo passo cruciale chirurgico appena iniziato l'intervento?", options: ["Asportare prima i linfonodi", "Chiudere la vena per evitare che gli ormoni vadano in giro (in circolo)", "Tagliare l'arteria surrenalica", "Palpare energicamente la ghiandola"], correct: 1, explanation: "Il primo step essenziale è legare e chiudere la vena surrenalica centrale prima di manipolare il tumore, per impedire una massiccia immissione di catecolamine nel torrente ematico che causerebbe crisi ipertensive fatali." },
            { id: 94, text: "L'acido vanilmandelico (VMA) è il principale metabolita di quale molecola in particolare?", options: ["Serotonina", "Noradrenalina (e adrenalina)", "Cortisolo", "Insulina"], correct: 1, explanation: "Il VMA è il prodotto di degradazione finale delle catecolamine, in particolare noradrenalina e adrenalina, utile per la diagnosi di feocromocitoma." },
            { id: 95, text: "Qual è la percentuale epidemiologica (incidenza) dei tumori neuroendocrini (NET) riportata a lezione?", options: ["10-15 casi per 100.000 persone ogni anno", "0.5 casi per 100.000 persone ogni anno", "2-3 casi per 100.000 persone ogni anno", "50 casi per 100.000 persone ogni anno"], correct: 2, explanation: "Come riportato dalle sbobine di riferimento, i tumori neuroendocrini hanno un'incidenza di circa 2-3 nuovi casi per 100.000 persone ogni anno." },
            { id: 96, text: "Riguardo all'embriologia delle paratiroidi, da dove derivano?", options: ["III tasca faringea le superiori, IV tasca le inferiori", "III tasca faringea le inferiori, IV tasca le superiori", "Entrambe dalla II tasca faringea", "Dal dotto tireoglosso"], correct: 1, explanation: "Le paratiroidi inferiori derivano dalla III tasca faringea (e migrano più in basso col timo), mentre le superiori derivano dalla IV tasca faringea." },
            { id: 97, text: "Quale organo è responsabile in prima linea della metabolizzazione della serotonina secreta dall'intestino?", options: ["Rene", "Polmone", "Fegato", "Milza"], correct: 2, explanation: "La serotonina escreta dall'intestino finisce nel circolo portale e viene quasi interamente metabolizzata dalle monoamino-ossidasi (MAO) nel fegato." },
            { id: 98, text: "Quali sono i vasi principali responsabili della formazione della vena porta?", options: ["Vena cava inferiore e vene epatiche, insieme al drenaggio venoso proveniente dalle vene renali e surrenaliche", "Vena mesenterica superiore, in confluenza con la vena splenica, unita al drenaggio delle vene gastriche e cistiche", "Vene iliache comuni e vene renali bilaterali, in unione al plesso venoso pelvico che drena nella circolazione sistemica", "Vena mesenterica inferiore in confluenza diretta con la vena cava inferiore, e le vene genitali (ovariche o testicolari)"], correct: 1, explanation: "La vena porta si forma tipicamente dalla confluenza della vena mesenterica superiore con la vena splenica (che a sua volta ha spesso già ricevuto la mesenterica inferiore). Riceve anche vene gastriche e cistiche." },
            { id: 99, text: "Come viene escreto dal corpo l'acido vanilmandelico per poter essere misurato a fini diagnostici?", options: ["Con la bile", "Con il sudore", "È escreto con le urine", "Tramite le feci"], correct: 2, explanation: "Il VMA è un metabolita idrosolubile che viene filtrato ed escreto con le urine, dove viene comunemente dosato (raccolta delle 24 ore)." },
            { id: 100, text: "A cosa è dovuta la colorazione storicamente usata per le cellule 'cromaffini'?", options: ["Argento", "Cromo", "Ferro", "Rame"], correct: 1, explanation: "Le cellule della midollare del surrene vengono definite cromaffini perché assumono una colorazione scura quando esposte a sali di cromo." },
            { id: 101, text: "I tumori carcinoidi classici mostrano affinità istologica per quale elemento chimico?", options: ["Argento", "Cromo", "Zinco", "Piombo"], correct: 0, explanation: "Le cellule dei carcinoidi sono note per le loro proprietà argentaffini e argirofile, legando i sali d'argento nelle preparazioni istologiche." },
            { id: 102, text: "Cosa producono le cellule Alfa del pancreas?", options: ["Insulina", "Somatostatina", "Glucagone", "Polipeptide Pancreatico"], correct: 2, explanation: "Le cellule Alfa delle isole di Langerhans secernono glucagone, ormone iperglicemizzante." },
            
            { id: 103, text: "Qual è il livello linfonodale più importante per la tiroide?", options: ["Livello I", "Livello II", "Livello III", "Livello VI (compartimento centrale)"], correct: 3, explanation: "Il compartimento centrale (livello VI) è la prima sede di metastasi del carcinoma papillare della tiroide e include i linfonodi pretracheali, paratracheali e prelaringei." },
            { id: 104, text: "Un referto citologico TIR5 (THY5) su un nodulo tiroideo richiede tipicamente:", options: ["Follow-up ecografico a 6 mesi", "Lobectomia diagnostica", "Tiroidectomia totale", "Agoaspirato ripetuto"], correct: 2, explanation: "TIR5 indica un'altissima probabilità di patologia maligna (carcinoma tiroideo) e dà indicazione chirurgica netta per la tiroidectomia totale, con eventuale linfadenectomia se indicata." },
            { id: 105, text: "Qual è la sede anatomica più frequente dei gastrinomi (Sindrome di Zollinger-Ellison) tra quelle elencate?", options: ["Corpo gastrico", "Fegato", "Duodeno", "Retto"], correct: 2, explanation: "Il 70-80% dei gastrinomi si localizza all'interno del cosiddetto 'gastrinoma triangle', che comprende la prima/seconda porzione del duodeno, la testa del pancreas e le zone limitrofe." },
            { id: 106, text: "Qual è il farmaco di prima linea indispensabile per evitare crisi ipertensive intraoperatorie in caso di feocromocitoma?", options: ["Beta-bloccanti in monoterapia", "Calcio-antagonisti", "Alfa-bloccanti", "Dopamina"], correct: 2, explanation: "Il trattamento preparatorio fondamentale consiste nell'alfa-blocco per stabilizzare la pressione prevenendo il vasospasmo periferico. Solo successivamente si aggiunge il beta-blocco per controllare la tachicardia. Mai usare prima il beta-blocco: scatenerebbe grave crisi ipertensiva." },
            { id: 107, text: "Qual è la sede più frequente dei Tumori Neuroendocrini (NET) del foregut?", options: ["Stomaco", "Duodeno", "Pancreas", "Polmoni"], correct: 3, explanation: "NOTA: le sbobine sono molto vaghe, ma sia nelle 23-24 che nelle 24-25 c’è espressamente scritto che tra quelli del foregut (intestino esterno formato da polmoni, timo, stomaco, duodeno e pancreas) i polmoni sarebbero quelli più frequenti. Invece se si parla di GI-NET, del tratto gastrointestinale, le percentuali diventano: piccolo intestino/intestino tenue(45%), retto(20%), appendice(17%), colon(11%),stomaco(7%)" },
            { id: 108, text: "Quali ghiandole paratiroidi risultano in genere meno variabili nella loro posizione anatomica?", options: ["Le paratiroidi superiori", "Le paratiroidi inferiori", "Le paratiroidi di sinistra", "Le paratiroidi di destra"], correct: 0, explanation: "Le paratiroidi inferiori, derivando dalla III tasca branchiale e migrando verso il basso col timo, hanno una posizione molto variabile (fino al mediastino). Le superiori (IV tasca) sono molto più costanti, situate posteriorly al terzo superiore della tiroide." },
            { id: 109, text: "A partire da quali valori sierici l'ipercalcemia può innescare una crisi ipercalcemica acuta e pericolosa?", options: ["10 mg/dl", "11 mg/dl", "12 mg/dl", ">14 mg/dl"], correct: 3, explanation: "La crisi ipercalcemica si manifesta clinicamente come una vera urgenza medica quando i livelli di calcio sierico superano o eguagliano i 14 mg/dl." },
            { id: 110, text: "In quale delle seguenti sindromi ereditarie è tipico poter trovare un gastrinoma?", options: ["Sindrome MEN 1", "Sindrome MEN 2A", "Sindrome MEN 2B", "Sindrome MEN 4"], correct: 0, explanation: "La MEN 1 (Sindrome di Wermer) è caratterizzata dalla presenza di neoplasie o iperplasie in '3 P': Paratiroidi (iperparatiroidismo), Pituitary (ipofisi) e Pancreas endocrino (ove i gastrinomi e insulinomi sono molto frequenti)." },
            { id: 111, text: "La mutazione attivante del proto-oncogene RET è caratteristica di:", options: ["Carcinoma papillare", "Carcinoma follicolare", "Carcinoma midollare della tiroide", "Adenoma di Plummer"], correct: 2, explanation: "Il Carcinoma Midollare della Tiroide (CMT), sia nelle varianti familiari (sindromi MEN2) che in molte forme sporadiche, è strettamente legato alle mutazioni del gene RET." },
            { id: 112, text: "Quali tra i seguenti accessi vengono utilizzati nella chirurgia tiroidea mini-invasiva (MIVAT e approcci remoti)?", options: ["Accesso Transorale (TOETVA)", "Accesso Ascellare", "Accesso Retroauricolare", "Tutti gli approcci elencati"], correct: 3, explanation: "Le moderne tecniche di chirurgia tiroidea remota e minimamente invasiva comprendono tutte queste opzioni: l'accesso transorale vestibolare (TOETVA), quello ascellare e quello retroauricolare (spesso eseguito con ausilio robotico)." },
            { id: 113, text: "Dopo un intervento di tiroidectomia totale, cosa è strettamente necessario somministrare al paziente?", options: ["Calcitonina", "Paratormone sintetico", "Levotiroxina (LT4)", "Nessuna terapia se i livelli di TSH restano bassi"], correct: 2, explanation: "L'asportazione totale della ghiandola tiroidea priva permanentemente l'organismo della sua fonte endogena di ormoni tiroidei; il paziente necessita di una terapia ormonale sostitutiva a vita con Levotiroxina (LT4)." },
            { id: 114, text: "Quale delle seguenti neoplasie NON fa tipicamente parte dello spettro clinico della sindrome MEN2?", options: ["Adenoma ipofisario", "Carcinoma midollare della tiroide", "Iperparatiroidismo primario", "Feocromocitoma"], correct: 0, explanation: "L'adenoma ipofisario è uno dei tratti patognomonici della MEN 1 (insieme a patologie paratiroidee e pancreatiche). Nelle sindromi MEN2 (A e B) si ritrovano invece costantemente il Carcinoma Midollare e spesso il Feocromocitoma." },
            { id: 115, text: "Che cos'è anatomicamente il legamento di Berry in ambito tiroideo?", options: ["Un legamento che fissa il pancreas posteriorly", "Il legamento che fissa il surrene al polo renale", "Il legamento sospensore posteriore della tiroide", "Un residuo fibroso del dotto tireoglosso"], correct: 2, explanation: "Il legamento di Berry (legamento sospensore posteriore) fissa fermamente i lobi della tiroide alla trachea posteriore. È un punto chirurgicamente molto delicato poiché vi entra in stretto contatto il nervo laringeo ricorrente." },
            { id: 116, text: "Qual è l'action chirurgica maggiormente raccomandata di fronte a un nodulo tiroideo con referto THY4/TIR4 all'agoaspirato?", options: ["Follow-up ogni 3 mesi", "Enucleoresezione", "Tiroidectomia totale", "Radioterapia locale"], correct: 2, explanation: "La categoria citologica THY4/TIR4 indica un forte sospetto di neoplasia maligna. Seguendo le linee guida correnti, specie per noduli di dimensioni rilevanti, la scelta terapeutica d'elezione è solitamente la tiroidectomia totale." },
            { id: 117, text: "Quale dei seguenti tumori tiroidei vanta, di norma, la sopravvivenza migliore e la prognosi più favorevole?", options: ["Carcinoma Papillare", "Carcinoma Follicolare", "Carcinoma Anaplastico", "Carcinoma a cellule di Hürthle"], correct: 0, explanation: "Il carcinoma papillare non solo rappresenta la forma di tumore tiroideo largamente più frequente, ma è anche il più indolente, vantando tassi di sopravvivenza che eccedono il 95% a 10 anni." },
            { id: 118, text: "Un iperparatiroidismo primario definito 'persistente' (che permane immediatamente dopo la prima chirurgia) a cosa è quasi sempre imputabile?", options: ["A un errore tecnico o mancata asportazione della ghiandola malata", "A una recidiva biologica della malattia ad anni di distanza", "A un secondo adenoma improvviso", "A una conversione maligna fulminea"], correct: 0, explanation: "Si parla di iperparatiroidismo 'persistente' quando la calcemia non si normalizza mai nel periodo post-operatorio. La causa di gran lunga più probabile è un errore chirurgico/tecnico, in cui la ghiandola patologica (spesso ectopica) non è stata né identificata né rimossa." },
            { id: 119, text: "In caso di un gozzo retrosternale o cervico-mediastinico che si estende profondamente con grande volume, quale procedura chirurgica aggiuntiva può rendersi necessaria?", options: ["Dissezione linfonodale cervicale preventiva", "Sternotomia mediana", "Sezione ampia dello sternocleidomastoideo", "Solo l'intubazione prolungata post-operatoria"], correct: 1, explanation: "Sebbene la maggioranza dei gozzi immersi possa essere dislocata ed estratta per via cervicale, in casi di volumi estremi nel mediastino o forti aderenze, il chirurgo può dover ricorrere a un accesso sternotomico per lavorare in sicurezza." },
            { id: 120, text: "Cosa si raccomanda di fare in presenza di un reperto TIR1 (citologia non diagnostica), ma in un contesto di ecografia fortemente sospetta e nodulo singolo >1 cm?", options: ["Rivalutazione ecografica annua", "Ripetere l'agoaspirato all'infinito senza agire", "Lobectomia diagnostica", "Tiroidectomia totale preventiva immediata"], correct: 2, explanation: "Mentre un esito TIR1 puro suggerisce di ripetere l'agoaspirato, se i reperti ecografici sono francamente sospetti (microcalcificazioni, margini irregolari) e il nodulo è clinicamente significativo, l'indicazione appropriata diviene l'asportazione chirurgica della metà tiroidea (lobectomia diagnostica)." },
            { id: 121, text: "In base alle linee guida di settore (es. Japan Association), qual è il primo e più dirimente step se sorge il sospetto di un carcinoma midollare in caso di un nodulo tiroideo?", options: ["Counseling genetico immediato a tappeto", "Lobectomia d'urgenza in anestesia locale", "Biopsia preventiva del linfonodo sentinella", "Dosaggio mirato della calcitonina"], correct: 0, explanation: "Il counseling genetico è il primo passo raccomandato perché circa un quarto dei carcinomi midollari della tiroide è ereditario e legato a una mutazione del gene RET, e conoscerla prima dell'operazione è vitale per la tua sicurezza e per la scelta del tipo di chirurgia." },
            { id: 122, text: "Qual è la strategia chirurgica di riferimento e preferita per trattare un'iperplasia multighiandolare paratiroidea (es. in pazienti con familiarità o MEN1)?", options: ["Asportazione dell'unica ghiandola visibilmente ingrandita", "Somministrazione esclusiva di calciomimetici e vitamina D", "Paratiroidectomia subtotale o totale con autotrapianto muscolare", "Ablazione non chirurgica con radioiodio 131"], correct: 2, explanation: "Nelle iperplasie genetiche/multighiandolari il difetto è sistemico e colpisce tutte le ghiandole. Si procede quindi all'asportazione quasi totale (lasciando in sede solo 50 mg di tessuto ben vascolarizzato) oppure alla tiroidectomia totale seguita dall'autotrapianto nel muscolo di un braccio, evitando così recidive nel collo." },
            { id: 123, text: "Quale trattamento chirurgico è raccomandato per un NET gastrico di Tipo 3?", options: ["Semplice resezione endoscopica mucosa", "Antrectomia senza dissezione", "Gastrectomia parziale senza prelievo di linfonodi", "Gastrectomia parziale o totale associata a un'adeguata linfoadenectomia"], correct: 3, explanation: "I NET gastrici di Tipo 3 sono forme sporadiche, di norma solitarie, grosse e con potenziale metastatico e aggressivo elevato. Il loro trattamento ricalca quello oncologico radicale dell'adenocarcinoma gastrico." },
            { id: 124, text: "Confrontando un Tumore Neuroendocrino Pancreatico (PNET) con un tumore esocrino (adenocarcinoma duttale pancreatico), quale affermazione è corretta?", options: ["L'adenocarcinoma duttale presenta una prognosi nettamente migliore", "I PNET godono tendenzialmente di una prognosi clinica più favorevole a lungo termine", "Hanno la medesima esatta incidenza annua", "Nessuno dei due è mai associato a sindromi ereditarie"], correct: 1, explanation: "Nonostante varino in base a stadio e grading, globalmente i tumori neuroendocrini del pancreas (PNET) presentano una storia naturale molto più indolente e una sopravvivenza di gran lunga migliore rispetto al letale adenocarcinoma esocrino." },
            { id: 125, text: "Durante un intervento di surrenalectomia destra, quale viene universalmente considerata la manovra o fase più critica dell'operazione?", options: ["Il reperimento del surrene nel grasso peri-renale", "La separazione della ghiandola dal polo renale superiore", "L'identificazione, chiusura sicura e successiva sezione della vena surrenalica destra", "Il delicato scostamento del lobo epatico destro"], correct: 2, explanation: "La vena surrenalica destra è proverbialmente cortissima e insidiosa, sboccando direttamente e a piombo nella grande Vena Cava Inferiore. Errori in questa fase possono causare repentine emorragie retroperitoneali difficilmente controllabili." },
            { id: 126, text: "Tra le patologie di pertinenza dell'endocrino-chirurgia, quale di queste neoplasie detiene il triste primato per essere la più letale (peggior sopravvivenza a 5 anni)?", options: ["Carcinoma midollare della tiroide", "Carcinoma corticosurrenalico", "Carcinoma paratiroideo", "NET di basso grado dell'appendice"], correct: 1, explanation: "Il carcinoma adrenocorticale (della corteccia surrenalica) è per fortuna una neoplasia molto rara, ma si dimostra biologicamente infausta, manifestandosi spesso già in stadio avanzato con un'elevatissima propensione alla recidiva e alla metastatizzazione." },
            { id: 127, text: "In quale specifico contesto procedurale il dosaggio intraoperatorio rapido del PTH (Paratormone) risulta essenziale?", options: ["Durante la paratiroidectomia mini-invasiva mirata (MIP)", "Nel corso di tiroidectomie per gozzi tiroidei tossici", "In ogni surrenalectomia per feocromocitoma", "Durante la linfadenectomia per neoplasie pancreatiche"], correct: 0, explanation: "Nella paratiroidectomia focalizzata mini-invasiva per singolo adenoma, il dosaggio del PTH (prelievi rapidi al tempo zero e dopo 10-15 minuti dall'escissione) garantisce, grazie a un dimezzamento dei valori, di aver estratto con successo l'unica ghiandola ipersecernente." },
            { id: 128, text: "Quale di questi reperti rientra tra le manifestazioni cliniche classiche dell'iperparatiroidismo primario sintomatico?", options: ["Nefrocalcinosi ostruttiva", "Fratture ossee patologiche e indebolimento", "Sintomi aspecifici quali astenia e alterazioni neuro-psichiche", "Tutte le precedenti manifestazioni elencate"], correct: 3, explanation: "L'esacerbazione dell'iperparatiroidismo primario è storicamente nota nel mondo anglosassone con il detto 'Stones (calcoli), bones (ossa), groans (dolori addominali) and moans (disturbi psichici)', racchiudendo le ampie sequele dell'ipercalcemia cronica." },
            { id: 129, text: "Allo stato dell'arte odierno, qual è il 'gold standard' chirurgico per il trattamento di un esteso gozzo multinodulare benigno in accrescimento?", options: ["Tiroidectomia totale completa", "Tiroidectomia subtotale di un tempo", "Lobectomia unilaterale conservando sempre l'istmo", "Solo un trial di radioterapia radiometabolica"], correct: 0, explanation: "Per i gozzi multinodulari bilaterali con indicazione chirurgica (es. sintomi compressivi), la tiroidectomia totale è diventata la procedura d'elezione per scongiurare definitivamente qualsiasi rischio di recidiva del gozzo sui residui ghiandolari nel tempo." },
