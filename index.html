            { id: 130, text: "Per il trattamento di quale patologia surrenalica l'approccio tramite surrenalectomia laparoscopica è considerato oggi il 'gold standard' incontrastato?", options: ["Grosse masse francamente invasive sospette per carcinoma corticale", "Grosse neoplasie maligne primarie con metastasi a distanza", "Piccoli adenomi surrenalici benigni e secernenti (es. per Iperaldosteronismo primario di Conn)", "Soltanto per il prelievo di milza accessoria"], correct: 2, explanation: "Per lesioni surrenaliche di dimensioni non eccessive e macroscopicamente benigne (sebbene funzionalmente attive causando sindrome di Conn o di Cushing), la chirurgia laparoscopica garantisce efficacia, basso trauma e pronto recupero." },
            { id: 131, text: "Analizzando l'incidenza delle localizzazioni, quale sede primaria di origine per i Tumori Neuroendocrini Gastrointestinali (GI-NET) si associa alla peggior sopravvivenza a 5 anni?", options: ["L'appendice cecale", "L'intestino tenue", "Il colon", "La giunzione retto-anale"], correct: 2, explanation: "I NET che si originano lungo il colon si presentano di frequente in stadio già locoregionalmente avanzato, tendono ad essere di maggiori dimensioni e con un grading superiore, portando così a una peggior prognosi complessiva." },
            { id: 132, text: "Quale esame diagnostico di imaging medico-nucleare si rivela particolarmente specifico e utile per localizzare e stadiare un tumore gastrinoma?", options: ["Octreoscan (Scintigrafia recettoriale) o PET-CT con Gallio-68 DOTATOC", "Scintigrafia miocardica d'emergenza con MIBG", "Scintigrafia puramente paratiroidea con Sestamibi", "Esclusivamente l'ecografia transaddominale epatica"], correct: 0, explanation: "I gastrinomi, essendo tumori neuroendocrini, esprimono molto frequentemente sulla loro superficie un'elevata densità di recettori per la Somatostatina. L'Octreoscan sfrutta analoghi radiomarcati per evidenziarli." },
            { id: 133, text: "Qual è il corretto approccio chirurgico per il trattamento asportativo dei gastrinomi pancreatici della ZES?", options: ["È invariabile: sempre e solo duodeno-cefalo-pancreasectomia per sicurezza", "Solo la semplice enucleazione locale per ogni tumore, a prescindere", "Nessuna, l'unico trattamento è il trapianto totale epato-pancreatico", "L'approccio varia moltissimo (da enucleazione a pancreatectomie ampie) basandosi in modo mirato su sede, dimensione e invasività della massa"], correct: 3, explanation: "L'intervento va rigorosamente modulato (chirurgia tailor-made): piccoli tumori ben circoscritti e superficiali si possono semplicemente enucleare per preservare il parenchima, mentre tumori profondi, multipli o mal posizionati possono imporre ampie resezioni (distale, cefalica)." },
            { id: 134, text: "Anatomicamente, in quali precisi distretti vascolari riversa il proprio contenuto la Vena Surrenalica Sinistra?", options: ["Rigorosamente e solo all'interno della grande Vena Cava Inferiore come a destra", "Immette direttamente e solo le sue diramazioni all'interno della Vena Porta", "Drena in modo caratteristico nella Vena Renale Sinistra, sovente ricevendo o affiancandosi al flusso della Vena Frenica Inferiore Sinistra", "Esclusivamente nell'intricato plesso venoso perigastrico"], correct: 2, explanation: "Rispetto al versante destro, la vena surrenalica sinistra descrive un tragitto rettilineo verso il basso confluendo assieme alla vena frenica inferiore a livello del margine superiore della vena renale sinistra." },
            { id: 135, text: "Un voluminoso feocromocitoma quando può essere inequivocabilmente considerato di natura 'maligna'?", options: ["Ogniqualvolta misuri diametri eccedenti in modo chiaro i 3 centimetri", "In ogni caso in cui venga dimostrata la sua insorgenza bilaterale o multicentrica", "L'unico fattore assodato è se il paziente sviluppa iperglicemie resistenti all'insulina", "Solamente qualora si riesca a documentare la presenza oggettiva di metastasi a distanza (es. fegato o scheletro)"], correct: 3, explanation: "Sul piano puramente istologico e morfologico al microscopio, le cellule del feocromocitoma non forniscono mai criteri precisi e assoluti per discriminarne la malignità potenziale. L'unica validazione pre/post-operatoria certa e infallibile della malignità è la presenza accertata di metastasi sistemiche a distanza." },
            { id: 136, text: "Quale livello linfonodale (stazione) rappresenta il compartimento centrale, di primaria importanza nella patologia tiroidea?", options: ["Livello II", "Livello IV", "Livello VI", "Livello VIII"], correct: 2, explanation: "Il livello VI costituisce il compartimento centrale del collo (linfonodi pretracheali, paratracheali e prelaringei/Delfian) ed è la prima stazione di drenaggio linfatico per la maggior parte dei tumori tiroidei." },
            { id: 137, text: "Quale problematica clinico-chirurgica è tipicamente causata dalle ghiandole paratiroidi ectopiche o soprannumerarie?", options: ["Non secernono mai PTH", "Sono causa frequente di iperparatiroidismo secondario", "Sono la causa principale di iperparatiroidismo persistente post-operatorio", "Degenerano sistematicamente in carcinoma"], correct: 2, explanation: "Le paratiroidi ectopiche (situate es. nel mediastino o diffuse nel collo) o le ghiandole soprannumerarie (più di 4) sono insidiose da individuare e rappresentano la causa più comune di fallimento chirurgico e iperparatiroidismo persistente." },
            { id: 138, text: "Di fronte a un nodulo tiroideo il cui agoaspirato restituisce un referto citologico TIR5, qual è la condotta terapeutica di scelta?", options: ["Follow-up clinico-ecografico a 6 mesi", "Enucleazione del solo nodulo", "Lobectomia diagnostica", "Tiroidectomia totale"], correct: 3, explanation: "Il referto TIR5 indica una diagnosi citologica conclusiva di malignità (es. carcinoma papillare). Le linee guida indicano come gold standard l'exeresi chirurgica oncologica, tipicamente la tiroidectomia totale." },
            { id: 139, text: "Quali organi rappresentano le sedi anatomiche di gran lunga più frequenti per l'insorgenza di un gastrinoma?", options: ["Stomaco e fegato", "Duodeno e pancreas", "Cistifellea e dotti biliari", "Ileo e appendice"], correct: 1, explanation: "I gastrinomi si localizzano per il 70-90% dei casi nel 'Triangolo del Gastrinoma' (Triangolo di Passaro), che anatomicamente comprende la parete del duodeno (sede più comune in assoluto) e la testa del pancreas." },
            { id: 140, text: "Per quale dei seguenti interventi di endocrino-chirurgia è assolutamente mandatoria una scrupolosa preparazione farmacologica per evitare complicanze intraoperatorie letali?", options: ["Tiroidectomia per gozzo multinodulare", "Surrenectomia per incidentaloma non secernente", "Paratiroidectomia per adenoma", "Surrenectomia per feocromocitoma"], correct: 3, explanation: "L'asportazione di un feocromocitoma richiede una preparazione di settimane con alfa-bloccanti ed espansione della volemia, per prevenire picchi ipertensivi durante la manipolazione del tumore e grave ipotensione post-rimozione." },
            { id: 141, text: "Tra gli organi derivanti dal foregut embrionale, quale rappresenta la sede più frequente di insorgenza dei Tumori Neuroendocrini (NET)?", options: ["Stomaco", "Polmoni", "Pancreas", "Timo"], correct: 1, explanation: "NOTA: le sbobine sono molto vaghe, ma sia nelle 23-24 che nelle 24-25 c’è espressamente scritto che tra quelli del foregut (intestino esterno formato da polmoni, timo, stomaco, duodeno e pancreas) i polmoni sarebbero quelli più frequenti. Invece se si parla di GI-NET, del tratto gastrointestinale, le percentuali diventano: piccolo intestino/intestino tenue(45%), retto(20%), appendice(17%), colon(11%),stomaco(7%)" },
            { id: 142, text: "Durante l'esplorazione chirurgica del collo, quali ghiandole paratiroidi risultano essere soggette a minore variabilità anatomica di posizione?", options: ["Le due paratiroidi inferiori", "Le due paratiroidi superiori", "Solo la paratiroide inferiore sinistra", "Tutte presentano la medesima variabilità"], correct: 1, explanation: "Le paratiroidi superiori (derivate dalla IV tasca branchiale) hanno un tragitto migratorio embrionale molto breve, per cui la loro posizione è decisamente più costante (solitamente posteriori al terzo medio-superiore della tiroide) rispetto alle inferiori che migrano col timo." },
            { id: 143, text: "Quale livello di calcemia sierica definisce clinicamente l'insorgenza di una 'crisi ipercalcemica', rappresentando un'urgenza medica?", options: ["Superiore a 10 mg/dl", "Superiore a 11,5 mg/dl", "Superiore a 12,5 mg/dl", "Uguale o superiore a 14 mg/dl"], correct: 3, explanation: "Sebbene l'ipercalcemia sia già diagnosticabile a valori inferiori, la vera e propria 'crisi ipercalcemica' (caratterizzata da disidratazione grave, confusione, coma e aritmie) si innesca tipicamente a valori ≥ 14 mg/dl." },
            { id: 144, text: "In quale variante delle Sindromi da Neoplasia Endocrina Multipla (MEN) è possibile e frequente riscontrare un gastrinoma?", options: ["Sindrome MEN 1", "Sindrome MEN 2A", "Sindrome MEN 2B", "Nessuna di queste"], correct: 0, explanation: "I gastrinomi (spesso multipli e maligni) sono i tumori neuroendocrini pancreatico-duodenali funzionanti più comuni nella MEN 1 (Sindrome di Wermer), che coinvolge Paratiroidi, Pancreas e Ipofisi." },
            { id: 145, text: "La mutazione germinale del proto-oncogene RET è il fattore di rischio eziologico alla base dello sviluppo di quali patologie?", options: ["Carcinoma papillare e adenoma paratiroideo", "Carcinoma midollare della tiroide e Feocromocitoma", "Gastrinoma e insulinoma", "Esclusivamente carcinoma anaplastico"], correct: 1, explanation: "Le mutazioni del gene RET causano le sindromi MEN 2. Il Carcinoma Midollare della Tiroide è presente nel 100% dei portatori, mentre il Feocromocitoma (spesso bilaterale) si sviluppa in circa il 50% dei casi." },
            { id: 146, text: "Come possono presentarsi i livelli sierici di calcio nelle fasi iniziali di un iperparatiroidismo primario confermato?", options: ["Sempre e solo francamente elevati", "Costantemente bassi (ipocalcemia)", "Elevati oppure normali", "Invariabilmente normali in ogni fase"], correct: 2, explanation: "Esiste un'entità clinica ben riconosciuta come 'Iperparatiroidismo primario normocalcemico', in cui il PTH è cronicamente elevato ma il calcio totale e ionizzato risultano (specie inizialmente) nei limiti alti della norma, per poi poter evolvere in ipercalcemia franca." },
            { id: 147, text: "Quali tra i seguenti sono tipi di punti di ingresso descritti per le tecniche di tiroidectomia remota/laparoscopica senza cicatrici visibili sul collo?", options: ["Sottoascellare", "Toracica", "Vestibolare", "Tutte le precedenti"], correct: 3, explanation: "La chirurgia remota per la tiroide ha sviluppato diversi accessi: l'accesso transascellare, quello toracico/mammario (es. tecnica BABA) e l'approccio transorale vestibolare (TOETVA)." },
            { id: 148, text: "Tra i seguenti farmaci, quale DEVE essere prescritto a vita a un paziente che ha subito una tiroidectomia totale?", options: ["TSH ricombinante", "Somatostatina", "Calcitonina sintetica", "Nessuna delle precedenti"], correct: 3, explanation: "Nessuno dei farmaci elencati è quello corretto (era una domanda a trabocchetto). Il farmaco salvavita da somministrare obbligatoriamente dopo una tiroidectomia totale è la Levotiroxina (L-T4), per compensare l'assenza degli ormoni tiroidei." },
            { id: 149, text: "Sindrome MEN 2: quali patologie sono tipicamente associate ad essa?", options: ["Feocromocitoma, Iperparatiroidismo, CMT (Carcinoma Midollare della Tiroide)", "Gastrinoma, Insulinoma, Adenoma ipofisario", "Carcinoma papillare, Linfoma, Insulinoma", "Solo Feocromocitoma e Gastrinoma"], correct: 0, explanation: "La MEN 2 è caratterizzata dalla presenza costante di Carcinoma Midollare della Tiroide (CMT), spesso associato a Feocromocitoma e, nella variante 2A, a patologie delle paratiroidi." },
            { id: 150, text: "Cosa secernono le cellule D (delta) del pancreas?", options: ["Insulina", "Glucagone", "Somatostatina (SS)", "Gastrina"], correct: 2, explanation: "Le cellule D (o delta) delle isole pancreatiche secernono Somatostatina (SS), un ormone con potente azione inibitoria su diverse funzioni endocrine ed esocrine." },
            { id: 151, text: "Perché chiamiamo le cellule del feocromocitoma 'cellule cromaffini'?", options: ["Perché si colorano intensamente con i sali d'argento", "Perché si colorano di scuro a contatto con i sali di cromo", "Perché contengono pigmenti di melanina", "Perché riflettono la luce polarizzata al microscopio"], correct: 1, explanation: "Vengono definite 'cromaffini' (affini al cromo) in quanto le catecolamine contenute nei loro granuli si ossidano a contatto con i sali di cromo, assumendo una tipica colorazione bruno-scura." },
            { id: 152, text: "Qual è la procedura chirurgica di scelta nel caso di singolo adenoma del surrene sinistro che causa una sindrome di Cushing, ACTH-indipendente?", options: ["Adrenalectomia bilaterale laparotomica", "Adrenalectomia monolaterale sinistra laparoscopica", "Resezione parziale laparoscopica del surrene sinistro", "Resezione laparoscopica del solo adenoma senza adrenalectomia"], correct: 1, explanation: "L'adrenalectomia monolaterale laparoscopica è il gold standard per gli adenomi surrenalici singoli secernenti (Cushing o Conn), garantendo l'asportazione radicale della ghiandola patologica con minimi tempi di recupero." },
            { id: 153, text: "Qual è la strategia chirurgica preferita nei pazienti con iperplasia multighiandolare delle paratiroidi per iperparatiroidismo familiare (MEN1)?", options: ["Resezione della ghiandola superiore e inferiore di un lato, lasciando le altre", "Resezione di solo una delle ghiandole macroscopicamente ingrossate", "Resezione di tutte e quattro le ghiandole con autotrapianto di frammento nel muscolo", "Non c'è indicazione chirurgica, ma è indicata solo terapia medica"], correct: 2, explanation: "Nella MEN1 l'iperplasia colpisce tutte le ghiandole in quanto difetto genetico sistemico; l'asportazione totale (o subtotale) con autotrapianto (es. nell'avambraccio o nello sternocleidomastoideo) previene le recidive cervicali e agevola i re-interventi." },
            { id: 154, text: "Quando il feocromocitoma è considerato maligno in fase diagnostica (prima quindi del trattamento chirurgico)?", options: ["Dimensioni superiori a 3 cm", "Se si presenta bilaterale", "Per la presenza documentata di metastasi", "Tutte le risposte precedenti sono corrette"], correct: 2, explanation: "Non esistono criteri istologici o citologici assoluti per stabilire la malignità di un feocromocitoma al microscopio; esso viene definito maligno clinicamente ed esclusivamente in presenza di metastasi in sedi dove le cellule cromaffini sono fisiologicamente assenti (es. linfonodi, fegato, ossa).Infatti nella classificazione della World Health Organization la dicitura 'feocromocitoma' maligno è stata sostituita con 'feocromocitoma metastatico'." },
            { id: 155, text: "Quale trattamento chirurgico è indicato nel caso di NET gastrico tipo 3?", options: ["Resezione endoscopica", "Resezione dell'antro gastrico", "Gastro-resezione parziale senza asportazione dei linfonodi perigastrici", "Gastrectomia totale o parziale con linfoadenectomia"], correct: 3, explanation: "I NET gastrici di Tipo 3 sono neoplasie sporadiche e solitarie, non associate ad ipergastrinemia e caratterizzate da un elevato potenziale aggressivo e metastatico. Il trattamento richiede ampie resezioni oncologiche (gastrectomia) con linfoadenectomia, seguendo gli stessi criteri dell'adenocarcinoma gastrico." },
            { id: 156, text: "Quale delle seguenti neoplasie non è presente nella MEN1?", options: ["Adenomi ipofisari", "Feocromocitoma", "Insulinoma", "Gastrinoma"], correct: 1, explanation: "Il feocromocitoma è tipico delle sindromi MEN2. La MEN1 (nota anche come sindrome delle 3 P) si caratterizza invece per alterazioni e tumori a carico di Pituitary (Ipofisi), Paratiroidi e Pancreas endocrino (Insulinoma, Gastrinoma)." },
            { id: 157, text: "Qual è la fase chirurgica più critica durante l'adrenalectomia destra?", options: ["Identificazione della ghiandola surrenale destra", "Isolamento e separazione dal polo superiore del rene", "Identificazione, chiusura e sezione della vena surrenalica destra", "Isolamento e separazione dal margine inferiore del lobo destro del fegato"], correct: 2, explanation: "La vena surrenalica destra è proverbialmente cortissima e sfocia a piombo e direttamente nella vena cava inferiore. Qualsiasi trazione incauta o errata in questa specifica fase di isolamento venoso può causare lacerazioni della cava ed emorragie massive repentine e spesso fatali." },
            { id: 158, text: "Quando viene effettuato il dosaggio del PTH intraoperatorio?", options: ["Durante paratiroidectomia mini-invasiva", "Durante lobectomia tiroidea", "Durante adrenalectomia monolaterale mini-invasiva", "Durante paratiroidectomia bilaterale open"], correct: 0, explanation: "Il dosaggio del PTH intraoperatorio (Criterio di Miami) si utilizza tipicamente durante la Paratiroidectomia Mini-Invasiva per adenoma singolo: verificando che il Paratormone scenda di oltre il 50% in 10-15 minuti dall'asportazione, il chirurgo ha la certezza di aver rimosso il tessuto ipersecernente senza dover esplorare gli altri quadranti del collo." },
            { id: 159, text: "Qual è la complicanza più frequente nelle resezioni della testa del pancreas?", options: ["Fistola pancreatica", "Pancreatite del moncone rimanente", "Sanguinamento del moncone rimanente", "Crisi ipoglicemiche"], correct: 0, explanation: "La complicanza chirurgica di gran lunga più frequente e temibile dopo una duodenocefalopancreasectomia (DCP) è la deiscenza dell'anastomosi pancreato-digiunale, che esita nella formazione di una fistola pancreatica, causando lo spandimento di enzimi digestivi epatotossici nell'addome." },
            { id: 160, text: "Nel paziente splenectomizzato per resezione distale del pancreas, aumenta il rischio di...?", options: ["Trombosi portale", "Anemizzazione cronica", "Infarto del miocardio", "Infezione"], correct: 0, explanation: "Questa complicanza vascolare è nota in letteratura e può essere favorita dalla manipolazione chirurgica, dalla stasi venosa e dalla trombocitosi reattiva post-operatoria. NOTA: anche infezione sembrerebbe giusta" },
            { id: 161, text: "Quali dei seguenti indicatori è necessario per la pianificazione della strategia terapeutica del P-NETs?", options: ["Markers tumorali", "Indici di funzionalità pancreatica esocrina", "Indice del grado di differenziazione tumorale (Ki-67)", "Tutti i precedenti"], correct: 3, explanation: "Sono tutti parametri essenziali prima di attuare una qualsiasi strategia" },
            { id: 162, text: "Nell'iperparatiroidismo primario, come può essere il livello di calcio sierico?", options: ["Elevato", "Normale", "Basso", "Elevato o Normale"], correct: 3, explanation: "Generalmente la calcemia è elevata, ma esiste una forma nota come 'iperparatiroidismo primario normocalcemico' in cui il PTH è alto ma il calcio totale rientra ancora nei limiti della norma." },
            { id: 163, text: "Qual è la più frequente causa di iperparatiroidismo secondario?", options: ["metastasi ossee", "insufficienza renale cronica", "adenoma paratiroideo ectopico", "tumore renale"], correct: 1, explanation: "L'insufficienza renale cronica altera il metabolismo della Vitamina D e del fosforo, innescando un'ipocalcemia che costringe le paratiroidi a un iperparatiroidismo secondario compensatorio." },
            { id: 164, text: "Quale delle seguenti procedure chirurgiche può rendersi necessaria durante una tiroidectomia totale, se è presente un gozzo retrosternale di grosse dimensioni?", options: ["Asportazione dei linfonodi del collo e del mediastino", "Sternotomia", "Sezione dei muscoli sternocleidomastoidei", "Tutte le precedenti risposte sono corrette"], correct: 1, explanation: "Quando un gozzo retrosternale è particolarmente voluminoso o bloccato nel mediastino e non può essere estratto dal collo in sicurezza, si rende necessaria l'apertura dello sterno (sternotomia)." },
            { id: 165, text: "Nel caso di un nodulo tiroideo benigno solitario, quale procedura chirurgica è più indicata?", options: ["Tiroidectomia totale", "Tiroidectomia subtotale", "Lobectomia tiroidea unilaterale con rimozione dell'istmo", "Rimozione locale del singolo nodulo"], correct: 2, explanation: "La lobectomia con istmectomia è l'intervento chirurgico definitivo, radicale e sicuro per trattare un nodulo isolato benigno confinato a un singolo lobo." },
            { id: 166, text: "Nel caso di singolo carcinoma tiroideo (TIR5) localizzato in un lobo, quale tipo di intervento è necessario effettuare?", options: ["Tiroidectomia totale", "Tiroidectomia sub totale", "Lobectomia tiroidea unilaterale con rimozione dell’istmo", "Rimozione locale del singolo nodulo"], correct: 0, explanation: "Il gold standard terapeutico oncologico per i carcinomi tiroidei differenziati (TIR5) superiori al centimetro è la tiroidectomia totale." },
            { id: 167, text: "Che azione viene raccomandata dalle linee guida nel caso di categoria diagnostica TIR 1 all'ago aspirato (FNA) di singolo nodulo tiroideo che ecograficamente ha caratteristiche sospette e dimensione superiore a un cm?", options: ["Follow-up senza trattamento chirurgico", "Lobectomia diagnostica", "Tiroidectomia sub-totale", "Tiroidectomia totale"], correct: 1, explanation: "Se l'esame è non diagnostico (TIR1) ma l'ecografia mostra caratteristiche francamente sospette, è prudente e raccomandata l'asportazione chirurgica della metà tiroidea (lobectomia diagnostica)." },
            { id: 168, text: "Se all'ago aspirato di un nodulo tiroideo (FNA) la diagnosi orienta verso un carcinoma midollare della tiroide, quale delle seguenti procedure diagnostiche è suggerita come primo step dalla Japan Association of Endocrine Surgery?", options: ["Counseling genetico.", "Lobectomia diagnostica", "Asportazione di linfonodo sentinella per valutare l'eventuale presenza di metastasi linfonodali", "Valutazione dei valori di calcitonina nel sangue"], correct: 0, explanation: "Il counseling genetico è il primo passo raccomandato perché circa un quarto dei carcinomi midollari della tiroide è ereditario e legato a una mutazione del gene RET, e conoscerla prima dell'operazione è vitale per la tua sicurezza e per la scelta del tipo di chirurgia." },
            { id: 169, text: "Quale dei seguenti tumori tiroidei può insorgere nell'ambito di una MEN2?", options: ["Follicolare", "Papillare", "Midollare", "Carcinoma delle cellule di Hurtle"], correct: 2, explanation: "Il carcinoma midollare della tiroide è la manifestazione clinica principale e immancabile delle sindromi familiari MEN2." },
            { id: 170, text: "Quale delle seguenti è la complicanza più seria della tiroidectomia?", options: ["Danno al nervo laringeo ricorrente", "Rimozione accidentale di una paratiroide", "Cicatrice cheloidea", "Edema laringeo"], correct: 0, explanation: "La lesione del nervo laringeo ricorrente provoca la paralisi delle corde vocali, che se bilaterale può causare un gravissimo e letale soffocamento respiratorio acuto." },
            { id: 171, text: "Quali dei seguenti trattamenti può essere indicato dopo tiroidectomia totale o quasi totale per carcinoma della tiroide e di qualunque variante istologica?", options: ["Terapia orale a base di calcitonina", "Supplementazione di vitamina", "Idratazione endovenosa sporadica", "Cicli di ablazione con radioiodio"], correct: 3, explanation: "Sebbene la domanda citi 'qualunque variante', nei carcinomi tiroidei classici differenziati il ciclo di ablazione con radioiodio è il trattamento indicato per distruggere ogni residuo microscopico o metastatico." },
            { id: 172, text: "In quanti sotto compartimenti sono suddivisi i linfonodi del compartimento centrale del collo?", options: ["2", "3", "4", "6"], correct: 2, explanation: "Il collo è standardizzato e suddiviso in 6 stazioni o livelli linfonodali principali, dal Livello I al Livello VI. Quest'ultimo, chiamato anche compartimento centrale, è a sua volta suddiviso in 4 sotto compartimenti: A superiormente, B a destra, C inferiormente, D a sinistra." },
            { id: 173, text: "Dopo lobectomia tiroidea destra per singolo nodulo del lobo destro della tiroide risultato essere un carcinoma papillare, l’esame istologico evidenzia anche un microcarcinoma papillare vicino al margine di resezione dell’istmo tiroideo. Cosa è indicato fare in questo caso?", options: ["Tiroidectomia di completamento", "Resezione del resto dell’istmo, lasciando in sede il lobo sinistro", "Semplice follow-up ecografico del lobo sinistro", "Discussione del caso in riunione multidisciplinare per decidere in base al caso singolo"], correct: 0, explanation: "Il riscontro di malattia ai margini di resezione dell'istmo comporta un rischio elevato di presenza di altri focolai, rendendo clinicamente necessaria la tiroidectomia di completamento." },
            { id: 174, text: "Il sestamibi, in quale componente cellulare si incorpora avidamente?", options: ["Apparato del Golgi", "Mitocondri", "Lisosomi", "Nucleo"], correct: 1, explanation: "Il Sestamibi è un radiofarmaco lipofilo che si concentra elettivamente nei mitocondri. Le cellule ossifile degli adenomi paratiroidei ne sono ricchissime, favorendo l'imaging." },
            { id: 175, text: "Qual è la principale causa di morte nei pazienti affetti da Men1?", options: ["Crisi ipercalcemica", "Crisi ipoglicemica", "Tumore ipofisario", "Tumore neuroendocrino gastroenteropancreatico ( GP-NET)"], correct: 3, explanation: "Nella sindrome MEN1, la causa primaria e più grave di ridotta sopravvivenza è legata all'evoluzione aggressiva e metastatica dei tumori neuroendocrini addominali (GEP-NET)." },
            { id: 176, text: "Perché è indicato il follow-up regolare a lungo termine nei pazienti affetti da MEN1 o MEN2 che hanno subito asportazione di tumori legati a tale patologia?", options: ["Controllo delle alterazioni ormonali rispetto alle ghiandole asportate", "Controllo della sintomatologia legata al tipo di tumore asportato", "Controllo delle complicanze legate al tipo di intervento effettuato", "Controllo del rischio di recidiva del tumore asportato o di insorgenza di altro tipo di tumore"], correct: 3, explanation: "Le sindromi MEN derivano da mutazioni genetiche germinali, per cui i pazienti mantengono a vita il rischio di sviluppare progressivamente altri tumori previsti dal quadro sindromico." },
            { id: 177, text: "Per effettuare l’intervento di adrenalectomia laparoscopica, quanti chirurghi sono necessari?", options: ["1", "2", "3", "4"], correct: 1, explanation: "Per eseguire in sicurezza una procedura laparoscopica sul surrene sono indispensabili 2 chirurghi: il primo operatore e il fondamentale assistente che manovra la videocamera." },
            { id: 178, text: "Qual è lo scopo principale della gestione preoperatoria dei pazienti da sottoporre ad adrenalectomia?", options: ["Prevenire le infezioni di ferita", "Prevenire le alterazioni metaboliche", "Prevenire le crisi ipertensive intraoperatorie", "Prevenire le alterazioni dell’alvo"], correct: 2, explanation: "Nel caso di surrenectomia (specificamente per feocromocitoma), la preparazione farmacologica con alfa-bloccanti è vitale per prevenire crisi ipertensive fatali sollecitate dal tocco del tumore." },
            { id: 179, text: "In quale metodica chirurgica viene utilizzato l’approccio vestibolare per tiroidectomia?", options: ["Tiroidectomia mini invasiva anteriore (MIVAT)", "Tiroidectomia Mining, vasi transascellare (MIT)", "Tiroidectomia endoscopica transorale", "Nessuna metodica chirurgica per tiroidectomia utilizza l’approccio vestibolare"], correct: 2, explanation: "L'approccio transorale (TOETVA) è una via endoscopica che passa attraverso il vestibolo inferiore della bocca per asportare la tiroide senza lasciare cicatrici visibili sul collo." },
            { id: 180, text: "Qual è la più frequente localizzazione anatomica dei tumori neuroendocrini gastrointestinali (GI-NETs)?", options: ["Piccolo intestino", "Appendice", "Retto", "Stomaco"], correct: 0, explanation: "NOTA: sarebbe segnata l'appendice come risposta esatta, ma le percentuali delle sbobine sono 45-50% per il tenue (o piccolo intestino), e 17% per l'appendice" },
            { id: 181, text: "Secondo le statistiche internazionali, qual è la sopravvivenza a cinque anni dei pazienti con diagnosi di carcinoma midollare della tiroide sporadico?", options: ["50%", "75%", "85%", "95%"], correct: 1, explanation: "Il carcinoma midollare ha una prognosi significativamente più severa rispetto ai carcinomi tiroidei differenziati, attestando la sopravvivenza a 5 anni per le forme sporadiche intorno al 75-80%." },
            { id: 182, text: "Dove fa metastasi il feocromocitoma?", options: ["Fegato", "Ossa e linfonodi", "Polmoni", "Tutte le precedenti"], correct: 3, explanation: "Quando il feocromocitoma si rivela francamente maligno, le sue cellule neuroendocrine diffondono massivamente creando metastasi a livello epatico, osseo, polmonare e linfonodale." },
            { id: 183, text: "Quali caratteristiche ha la chirurgia mini invasiva?", options: ["Si fa su strutture di piccole dimensioni", "Permette minor lesioni e complicanze chirurgiche", "Si fa con strumenti di piccole dimensioni", "Tutte le risposte sono esatte"], correct: 3, explanation: "La chirurgia mini-invasiva combina strumenti dal diametro ridotto a un accesso traumatico minimo, abbattendo il rischio di ampie lesioni tissutali per aggredire adenomi o strutture di piccole dimensioni." },
            { id: 184, text: "Un paziente che ha subito da poco una tiroidectomia totale presenta difficoltà respiratoria ed edema nella regione del collo. Non ha il drenaggio, ha terapia d’ossigeno da canule nasali al 4%, saturazione 92%. Come si interviene?", options: ["Si aumenta l’ossigeno", "TC", "Risonanza magnetica", "Si apre qualche punto di sutura al letto del paziente"], correct: 3, explanation: "Il quadro descrive un ematoma cervicale soffocante in rapida espansione. L'emergenza richiede la decompressione tempestiva aprendo immediatamente la ferita al letto del paziente per liberare la trachea." },
            { id: 185, text: "Quale delle seguenti affermazioni sulle paratiroidi ectopiche è corretta?", options: ["Sono rare", "Non possono localizzarsi in collo o mediastino", "Non sono causa di iperparatiroidismo persistente", "Rappresentano una causa di fallimento chirurgico e iperparatiroidismo persistente"], correct: 3, explanation: "Le paratiroidi in posizione anatomica ectopica (spesso migrate nel mediastino insieme al timo) sono insidiose da individuare e rappresentano una delle cause più frequenti di iperparatiroidismo persistente dopo la chirurgia." },
            { id: 186, text: "Dove fanno metastasi i paragangliomi:", options: ["Ossa e linfonodi", "Polmoni", "Fegato", "Tutte le precedenti"], correct: 3, explanation: "I paragangliomi (feocromocitomi extrasurrenalici), analogamente ai tumori della midollare, mostrano una diffusione metastatica aggressiva verso ossa, fegato e linfonodi." },
            { id: 187, text: "Quale delle seguenti affermazioni sul GI-NET dell’appendice è corretta:", options: ["Sono i tumori più frequenti dell’appendice", "Sono spesso maligni", "Sono spesso non secernenti", "Viene fatta emicolectomia destra, anche se il tumore è inferiore a due cm"], correct: 0, explanation: "I carcinoidi (GI-NET) sono in assoluto le neoplasie primitive più frequentemente diagnosticate a carico dell'appendice cecale, spesso scoperti incidentalmente e di natura perlopiù benigna o indolente." },
            { id: 188, text: "A cosa deve fare attenzione il chirurgo durante una adrenalectomia?", options: ["Tessuto adiposo", "Distretto venoso", "Distretto arterioso", "Linfonodi"], correct: 1, explanation: "L'identificazione, l'isolamento e la legatura sicura del distretto venoso (specialmente l'insidiosa vena surrenalica destra) è il momento più critico e a maggior rischio di sanguinamento fulminante dell'intera operazione." },
            { id: 189, text: "qual è il GI-NET foregut più frequente?", options: ["Stomaco", "Polmone", "Pancreas", "Duodeno"], correct: 1, explanation: "NOTA: le sbobine sono molto vaghe, ma sia nelle 23-24 che nelle 24-25 c’è espressamente scritto che tra quelli del foregut (intestino esterno formato da polmoni, timo, stomaco, duodeno e pancreas) i polmoni sarebbero quelli più frequenti. Invece se si parla di GI-NET, del tratto gastrointestinale, le percentuali diventano: piccolo intestino/intestino tenue(45%), retto(20%), appendice(17%), colon(11%),stomaco(7%)" },
            { id: 190, text: "Qual è secondo le linee guida il corretto ordine diagnostico?", options: ["BAO-test di simulazione secretina-gastrinemia", "Gastrinemia-BAO-test di simulazione secretina", "BAO-gastrinemia-test simulazione secretina", "Gastrinemia-test simulazione secretina-BAO"], correct: 1, explanation: "L'iter per il gastrinoma parte dal sospetto con la misurazione della Gastrinemia, confermata dalla valutazione dell'acidità (BAO), e certificata infine dinamicamente con il test di simulazione alla secretina." },
            { id: 191, text: "Quale neoplasia è presente nelle MEN2?", options: ["Feocromocitoma", "Ipofisi", "GI-NETs", "Adenoma papillare della tiroide"], correct: 0, explanation: "Il feocromocitoma è una neoplasia tipicamente associata alle sindromi MEN2 (sia 2A che 2B), manifestandosi in circa il 50% dei pazienti." },
            { id: 192, text: "In quale tumore la gravità è associata alla mutazione del gene RET:", options: ["Ipofisi", "Adenoma papillare della tiroide", "Carcinoma midollare della tiroide", "GI-NETs"], correct: 2, explanation: "Il Carcinoma midollare della tiroide familiare è causato da mutazioni del proto-oncogene RET. La gravità clinica e l'età di insorgenza sono direttamente correlate allo specifico codone del gene mutato." },
            { id: 193, text: "In caso di carcinoma tiroideo TIR5 quale chirurgia è più indicata:", options: ["Tiroidectomia totale", "Tiroidectomia subtotale", "Lobectomia", "Lobectomia+ rimozione linfonodi"], correct: 0, explanation: "Per la categoria citologica TIR5 (rischio di malignità > 95%), le linee guida indicano come gold standard la tiroidectomia totale, fondamentale per asportare la neoplasia ed eventuali focolai controlaterali." },
            { id: 194, text: "Quale affermazione sulla tiroide è corretta:", options: ["Localizza tra C5 e T1", "Localizza tra T2 e T6", "Localizza nel mediastino anteriore", "Localizza alla base della lingua (C1-C3)"], correct: 0, explanation: "Anatomicamente, la ghiandola tiroidea è situata nella regione anteriore del collo, estendendosi tipicamente dal livello della quinta vertebra cervicale (C5) fino alla prima vertebra toracica (T1)." },
            { id: 195, text: "Quale affermazione sul nervo ricorrente è corretta:", options: ["Localizzato maggiormente nell’angolo tra trachea ed esofago", "Non è soggetto a variabilità anatomiche", "Passa superficialmente al muscolo omoioideo", "Innerva i muscoli costrittori della faringe"], correct: 0, explanation: "Il nervo laringeo ricorrente risale verso la laringe alloggiandosi nel solco tracheo-esofageo, un punto di repere fondamentale durante l'intervento di tiroidectomia." },
            { id: 196, text: "In quante stazioni linfonodali si divide il collo:", options: ["6", "4", "5", "3"], correct: 0, explanation: "A fini clinici e chirurgici oncologici, il collo è standardizzato e suddiviso in 6 stazioni o livelli linfonodali principali (dal Livello I al Livello VI)." },
            { id: 197, text: "Nell’iperparatiroidismo primario, anche in fase iniziale, come può essere la calcemia:", options: ["Alta", "Normale", "Bassa", "Alta o Normale"], correct: 3, explanation: "In questa patologia, la calcemia può essere palesemente alta o presentarsi normale nelle fasi iniziali (forma normocalcemica)." },
            { id: 198, text: "Dopo tiroidectomia totale quale ormone deve essere reintegrato oralmente?", options: ["Calcitonina", "Paratormone", "TSH", "Nessuno dei precedenti"], correct: 3, explanation: "Dopo una tiroidectomia totale, deve essere reintegrata a vita la Levotiroxina (L-T4). Poiché non è tra le opzioni (A, B, C), la risposta corretta è 'Nessuno dei precedenti'." },
            { id: 199, text: "Dopo tiroidectomia subtotale cosa si deve fare in caso di TIR5:", options: ["Ablazione con iodio", "Scintigrafia", "TC", "Sestamibi"], correct: 0, explanation: "Clinicamente sarebbe necessaria prima una 'tiroidectomia di completamento' per rimuovere il lobo residuo. Tuttavia, nell'ottica oncologica della gestione del carcinoma (TIR5), lo step terapeutico differenziale successivo prevede l'ablazione dei focolai maligni con radioiodio." },
            { id: 200, text: "Quale di queste sono indicazioni per operare un gozzo:", options: ["Estetica", "Sintomi da compressione", "Non responsività ai farmaci", "Tutte le precedenti"], correct: 3, explanation: "Un gozzo multinodulare viene trattato chirurgicamente per motivi di ingombro estetico invalidante, quando genera sintomi da compressione meccanica (disfagia, dispnea) o quando la terapia medica fallisce nel controllarne l'accrescimento." },
            { id: 201, text: "Quale di questi è associato a GI-NETs gastrico G1:", options: ["Gastrite atrofica cronica (CAG)", "Sindrome Zollinger-Ellison", "Ulcera peptica perforata", "Infezione acuta da H. Pylori"], correct: 0, explanation: "I NET gastrici di tipo 1 (i più frequenti) sono indotti dall'ipergastrinemia cronica secondaria all'acloridria, che è tipicamente causata da una Gastrite Atrofica Cronica autoimmune (CAG)." },
            { id: 202, text: "Quale di questi è segno di malignità in caso di nodulo tiroideo:", options: ["Margini irregolari", "Calcificazioni", "Estensione extratiroidea", "Tutte le precedenti"], correct: 3, explanation: "L'ecografia sospetta malignità in presenza di margini irregolari o spiculati, microcalcificazioni e segni di invasione dei tessuti molli circostanti (estensione extratiroidea)." },
            { id: 203, text: "Quali età è il cut-off per la classificazione TNM:", options: ["50 anni", "55 anni", "60 anni", "75 anni"], correct: 1, explanation: "Nell'ottava edizione dell'AJCC per il carcinoma differenziato della tiroide, l'età di 55 anni funge da cut-off: i pazienti sotto i 55 anni hanno una prognosi eccellente e non superano lo stadio II anche in presenza di metastasi a distanza." },
            { id: 204, text: "Un paziente dopo tiroidectomia totale risulta ipocalcemico7.7mg/dL (v.n. 8.5-10.5 mg/dL). I valori di PTH sono normali, cos’è consigliato fare:", options: ["Somministrazione calcio orale (per tre mesi)", "Somministrazione calcio endovena, poi orale fino a normalizzazione dei valori", "Somministrazione orale di calcio fino a normalizzazione valori", "Somministrazione calcitonina"], correct: 2, explanation: "Poiché il Paratormone (PTH) è normale, non c'è asportazione delle paratiroidi. L'ipocalcemia è transitoria (es. 'hungry bone syndrome'). È sufficiente una somministrazione orale di calcio per correggere il deficit." },
            { id: 205, text: "Quale di queste è la causa di iperparatiroidismo secondario?", options: ["Insufficienza renale cronica", "Iperplasia paratiroidi", "Problemi cardiovascolari", "Adenoma paratiroideo singolo"], correct: 0, explanation: "L'insufficienza renale cronica è la principale causa di iperparatiroidismo secondario: i reni malati non attivano la Vitamina D e trattengono fosforo, abbassando il calcio sierico e costringendo le paratiroidi all'iperattività." },
            { id: 206, text: "Cosa viene fatto durante l’intervento per confermare la rimozione della paratiroide patologica:", options: ["Test intraoperatorio per misurazione PTH", "Istologica intraoperatoria delle paratiroidi asportate", "Ecografia cervicale intraoperatoria", "Dosaggio della calcitonina"], correct: 0, explanation: "Il dosaggio rapido intraoperatorio del PTH (Metodo di Miami) permette di verificare in sala operatoria un crollo del PTH (>50% in 10-15 minuti), garantendo di aver asportato la ghiandola colpevole." },
            { id: 207, text: "Cosa viene fatto per evitare di lesionare il nervo laringeo durante tiroidectomia?", options: ["Monitoraggio con elettrodi del nervo", "Identificazione ed isolamento", "Recisione asettica preventiva", "Nessuna delle precedenti"], correct: 1, explanation: "Sebbene il monitoraggio elettronico sia un ottimo ausilio moderno, la 'regola d'oro' chirurgica essenziale e insostituibile per salvare il nervo è la sua diretta identificazione visiva e il suo delicato isolamento." },
            { id: 208, text: "Quale di queste sindromi sono associate a carcinoma del surrene:", options: ["Li-Fraumeni", "Sindrome di Marfan", "Sindrome di Zollinger-Ellison", "Sindrome di Conn"], correct: 0, explanation: "La Sindrome di Li-Fraumeni, derivante dalla mutazione del gene oncosoppressore p53, predispone fortemente all'insorgenza del raro carcinoma corticosurrenalico, specialmente in età pediatrica." },
            { id: 209, text: "Sedi dei paragangliomi:", options: ["Lungo catena gangliare simpatica paravertebrale", "Nel parenchima polmonare distale", "Nella midollare del surrene", "Nell'ipofisi anteriore"], correct: 0, explanation: "I paragangliomi sono tumori extra-surrenalici che originano fisiologicamente dai gangli del sistema neurovegetativo, situati prevalentemente lungo la catena simpatica paravertebrale addominale." },
            { id: 210, text: "Quale di queste è la manifestazione principale in un insulinoma:", options: ["Ipoglicemia", "Iperglicemia", "Ipocalcemia", "Dolore addominale"], correct: 0, explanation: "L'insulinoma produce insulina in modo sregolato e autonomo, svuotando il sangue dagli zuccheri e causando crisi neuroglicopeniche dovute a severa ipoglicemia a digiuno." },
            { id: 211, text: "Dove è più frequente la sindrome Zollinger-Ellison:", options: ["Duodeno e pancreas", "Stomaco e pancreas", "Solo pancreas", "Solo stomaco"], correct: 0, explanation: "I gastrinomi, responsabili della Sindrome di Zollinger-Ellison, si localizzano quasi esclusivamente (70-90%) nel 'Triangolo del Gastrinoma', che include l'area del duodeno e la testa del pancreas." },
            { id: 212, text: "Quale intervento è più indicato in caso di GI-NETs del piccolo intestino:", options: ["Resezione in open", "Resezione endoscopica", "Intervento farmacologico", "Chemioterapia"], correct: 0, explanation: "I NET del piccolo intestino tendono a creare vaste reazioni desmoplastiche, fibrosi e infiltrazione mesenterica. L'approccio laparotomico (open) garantisce un'adeguata esplorazione e una corretta resezione vascolare." },
            { id: 213, text: "Quale dei seguenti GI-NETs ha la peggior prognosi a cinque anni?", options: ["Appendice", "Intestino tenue", "Colon", "Retto"], correct: 2, explanation: "I carcinoidi localizzati nel colon vengono spesso scoperti tardivamente, quando le dimensioni sono ormai considerevoli e lo stadio di invasione e metastatizzazione è avanzato, peggiorandone severamente la prognosi." },
            { id: 214, text: "Qual è la sede più frequente dei gastronomi?", options: ["Stomaco e duodeno", "Stomaco e pancreas", "Duodeno e pancreas", "Pancreas soltanto"], correct: 2, explanation: "Nota: la parola 'gastronomi' è un refuso per 'gastrinomi'. La loro sede d'elezione assoluta è l'area che copre la prima/seconda porzione del duodeno e la testa del pancreas." },
            { id: 215, text: "Qual è il metodo di immagine specifico per localizzare un gastrinoma?", options: ["Octreoscan", "MIBG Scan", "Sestamibi SPECT scan", "Scintigrafia con iodio radioattivo"], correct: 0, explanation: "I gastrinomi, essendo tumori neuroendocrini, presentano un'alta densità di recettori per la somatostatina. L'Octreoscan (o la PET-DOTATOC) utilizza analoghi radiomarcati per illuminare in modo specifico tali recettori." },
            { id: 216, text: "Qual è la causa della sindrome di Zollinger- Ellison?", options: ["Insulinoma", "Gastrinoma", "Glucagonoma", "Somatostatinoma"], correct: 1, explanation: "La patologia è scatenata da un Gastrinoma, un tumore neuroendocrino che secerne massicce quantità di gastrina, iperstimolando la produzione acida dello stomaco e causando ulcere gravi." },
            { id: 217, text: "La presentazione clinica più frequente di un insulinoma è:", options: ["Iperglicemia sintomatica", "Ipoglicemia sintomatica", "Dolore addominale", "Malassorbimento"], correct: 1, explanation: "La produzione eccessiva di insulina abbassa drasticamente i livelli di glucosio nel sangue, manifestandosi clinicamente con crisi ipoglicemiche accompagnate da sintomi neuroglicopenici (confusione, svenimenti)." },
            { id: 218, text: "Il trattamento chirurgico dell’insulinoma del pancreas è:", options: ["Pancreatectomia totale", "Resezione pancreatica parziale", "Escissione locale del tumore", "Tutti i precedenti trattamenti sono possibili e la scelta dipende dalla sede del tumore, dalla dimensione, dal grado di infiltrazione locale"], correct: 3, explanation: "La chirurgia è 'tailored': se il tumore è superficiale e benigno si procede con enucleazione locale; se è profondo o sospetto maligno si opta per ampie resezioni parziali." },
            { id: 219, text: "In quale delle seguenti multi multiple endocrine neoplasias (MEN) può essere presente il gastrinoma?", options: ["MEN1", "MEN2", "MEN1 e MEN2A", "MEN1 e MEN2B"], correct: 0, explanation: "Il gastrinoma (insieme all'insulinoma) è uno dei tumori neuroendocrini gastroenteropancreatici (GEP-NET) più tipicamente associati alla sindrome MEN1, costituendo la 'P' di Pancreas endocrino." },
            { id: 220, text: "Quale delle seguenti non è un’indicazione alla chirurgia delle ghiandole surrenali?", options: ["Sindrome Cushing ACTH indipendente", "Sindrome di Cushing non -ACTH dipendente (se la chirurgia dell’ipofisi non ha avuto successo)", "Iperaldosteronismo (sindrome di Conn)", "Morbo di Addison"], correct: 3, explanation: "Il Morbo di Addison è un'insufficienza corticosurrenalica cronica (spesso autoimmune) che atrofizza le ghiandole, azzerando la produzione di cortisolo. Richiede terapia medica sostitutiva, non vi è alcun ruolo per la chirurgia." },     
            { id: 221, text: "Quale evento patologico può portare alla scoperta di una neoplasia endocrina del pancreas?", options: ["Crisi ipertensive acute", "Pancreatite acuta", "Polmonite virale", "Alterazioni del tracciato ECG"], correct: 1, explanation: "La pancreatite acuta può presentarsi come una complicanza meccanica rivelatrice: l'accrescimento del tumore neuroendocrino pancreatico (P-NET) può ostruire i dotti pancreatici limitrofi, innescando così l'infiammazione acuta della ghiandola." },
            { id: 222, text: "Quale dei seguenti P-NET ha la più alta percentuale di benignità?", options: ["Insulinoma", "Gastrinoma", "P-NETs non funzionali (non secernenti ormoni)", "VIPoma"], correct: 0, explanation: "A differenza degli altri tumori neuroendocrini del pancreas che mostrano frequenti comportamenti maligni e invasivi, l'insulinoma sporadico è notoriamente benigno e isolato in circa il 90% dei casi." },
            { id: 223, text: "Quale tecnica viene utilizzata per il monitoraggio del nervo laringeo inferiore (n. ricorrente) durante l’intervento di tiroidectomia?", options: ["Impiego di ottica laparoscopica ad alta risoluzione", "Impiego di colorazione con verde di indocianina", "Neuro monitoraggio del nervo vago", "Monitoraggio diretto sotto visione mediante identificazione ed isolamento del nervo"], correct: 3, explanation: "Nonostante l'esistenza di sonde per il neuromonitoraggio, lo standard chirurgico primario, essenziale ed insostituibile per preservare il nervo laringeo ricorrente rimane la sua accurata identificazione visiva diretta e il suo isolamento anatomico." },
            { id: 224, text: "Prima di un intervento chirurgico sulla tiroide quale valutazione preoperatoria è necessaria?", options: ["Test molecolare per B-RAF", "Laringoscopia", "Tac torace", "Tutte le precedenti"], correct: 1, explanation: "La laringoscopia preoperatoria è una valutazione clinica e medico-legale indispensabile per controllare la corretta motilità delle corde vocali, accertandosi che non vi siano paralisi asintomatiche pregresse dei nervi laringei." },
            { id: 225, text: "Nel caso di carcinoma midollare della tiroide, senza evidenza di metastasi linfonodali del collo, quale procedura chirurgica è indicata?", options: ["Tiroidectomia totale senza linfoadenectomia", "Tiroidectomia totale con linfoadenectomia centrale", "Tiroidectomia totale con linfoadenectomia centrale e dei livelli III e IV", "Tiroidectomia totale con linfoadenectomia centrale e dei livelli II e V"], correct: 1, explanation: "Il carcinoma midollare diffonde precocemente e massicciamente ai linfonodi. Per questo motivo, le linee guida impongono sempre l'associazione di una tiroidectomia totale ad uno svuotamento profilattico del compartimento linfonodale centrale (Livello VI)." },
            { id: 226, text: "Qual è il peso medio di una paratiroide?", options: ["20 mg", "30 mg", "40 mg", "50 mg"], correct: 1, explanation: "In condizioni fisiologiche di normalità, il peso medio di una singola ghiandola paratiroidea sana si attesta attorno ai 30 milligrammi. " },
            { id: 227, text: "Rispetto alla forma sporadica, quale condizione peggiore nell’iperparatiroidismo familiare?", options: ["Ipercalcemia calce", "Densità minerale ossea", "Nefrolitiasi", "Alterazioni cardiache"], correct: 1, explanation: "NOTA: è segnata questa come risposta corretta, in quanto i pazienti con iperaparatiroidismo hanno alti livelli di PTH che favorisce la lisi ossea, diminuendone la densità. Tuttavia questo sembrerebbe accadere in tutti i casi di iperparatiroidismo, familiari e non. Invece i pazienti affetti da quadri di iperparatiroidismo familiare (come nelle sindromi MEN1) tendono a sviluppare una forma più aggressiva di nefrolitiasi (calcolosi renale) e complicanze urinarie rispetto a chi è affetto da adenoma sporadico." },
            { id: 228, text: "Nella adrenalectomia laparoscopica, quale gas viene utilizzato per creare lo spazio chirurgico?", options: ["CO2", "Aria filtrata", "Elio", "Azoto"], correct: 0, explanation: "L'anidride carbonica (CO2) è il gas universalmente utilizzato per creare il pneumoperitoneo o lo pneumoretroperitoneo in laparoscopia: è inerte, non combustibile (sicuro con l'elettrobisturi) e viene facilmente smaltito dai polmoni." },
            { id: 229, text: "Quale di queste sindromi genetiche può essere associata al carcinoma della corticale del surrene?", options: ["Sindrome di Marfan", "Sindrome di Crigler-Najjar", "Sindrome di Turcot", "Sindrome di Li-Fraumeni"], correct: 3, explanation: "La Sindrome di Li-Fraumeni, patologia rara derivante da una mutazione germinale del gene oncosoppressore TP53, predispone severamente i bambini e i giovani adulti allo sviluppo del letale carcinoma corticosurrenalico." },
            { id: 230, text: "Quanti trocar vengono utilizzati per effettuare una adrenalectomia laparoscopica?", options: ["2", "3", "4", "5"], correct: 1, explanation: "Standardmente e di base, un'adrenalectomia laparoscopica (specie a sinistra) prevede l'inserimento di 3 trocar: uno destinato all'ottica (telecamera) e due destinati agli strumenti manovrati dalle braccia del chirurgo." },
            { id: 231, text: "Per quale tipo di patologia viene più frequentemente utilizzata la termoablazione con radiofrequenza o microonde?", options: ["Trattamento delle metastasi polmonari", "Trattamento delle metastasi peritoneali", "Trattamento dei tumori neuroendocrini del pancreas", "Trattamento delle metastasi epatiche"], correct: 3, explanation: "La termoablazione (tramite radiofrequenza o microonde) è uno strumento citoriduttivo di enorme utilità per 'bruciare' localmente i noduli metastatici epatici dei tumori neuroendocrini, arginando il rilascio ormonale sistemico." },
            { id: 232, text: "Quale delle seguenti è attualmente considerata la procedura diagnostica di primo livello di scelta per la valutazione di un nodulo tiroideo sospetto?", options: ["Ago aspirato per esame citologico (FNA)", "Scintigrafia", "TAC", "RMN"], correct: 0, explanation: "L'Ago Aspirato con ago sottile (FNA), accuratamente guidato sotto visione ecografica, è il 'gold standard' metodologico e la procedura di primissima scelta per definire citologicamente la natura di un nodulo." },
            { id: 233, text: "Quale ormone viene secreto dal carcinoma midollare della tiroide?", options: ["Ossitocina", "Paratormone", "Calcitonina", "Serotonina"], correct: 2, explanation: "Il Carcinoma Midollare della Tiroide (CMT) origina dalle cellule C parafollicolari della ghiandola, che sintetizzano abbondanti e patologici livelli di calcitonina sierica, la quale funge da marker diagnostico inequivocabile." },
            { id: 234, text: "Dove si trovano i recettori per il calcio (Calcium-Sensing Receptors)?", options: ["Sulle cellule parafollicolari C della tiroide", "Sulle cellule parafollicolari delle paratiroidi", "Sulle cellule cromaffine", "Sulle cellule parafollicolari delle paratiroidi e C della tiroide"], correct: 3, explanation: "I Recettori sensibili al calcio (CaSR) presidiano strettamente l'omeostasi corporea e si trovano sulle cellule C della tiroide (stimolando la calcitonina) e sulle cellule paratiroidee (inibendo la secrezione di PTH in caso di calcio alto)." },
            { id: 235, text: "Quale di queste è una manifestazione clinica frequente dell’iperparatiroidismo primario?", options: ["Calcolosi renale", "Calcolosi della colecisti", "Aterosclerosi", "Artrite reumatoide"], correct: 0, explanation: "A causa della massiccia osteolisi e dei livelli persistentemente alti di calcio, i reni si trovano a dover filtrare un surplus minerale notevole (ipercalciuria), favorendo così la rapida precipitazione di cristalli e la conseguente calcolosi renale." },
            { id: 236, text: "In caso di ipercalcemia, quale variazione nel tracciato ECG è rilevabile?", options: ["Intervallo QT accorciato", "Intervallo QT allungato", "Onda T più corta", "Intervallo PR accorciato"], correct: 0, explanation: "L'eccesso sistemico di calcio velocizza e abbrevia il potenziale d'azione e la fase di ripolarizzazione ventricolare del muscolo cardiaco, traducendosi in maniera patognomonica in un netto accorciamento dell'intervallo QT all'elettrocardiogramma." },
            { id: 237, text: "Quale dei seguenti metodi di imaging è specifico per identificare un adenoma paratiroideo?", options: ["Octreo-Scan", "MIBG Scan", "Sestamibi SPECT Scan", "Iodio radioattivo Scan"], correct: 2, explanation: "La scintigrafia d'elezione per visualizzare gli adenomi iperfunzionanti delle paratiroidi sfrutta il radiofarmaco Sestamibi marcato con Tecnezio-99m, che viene avidamente incamerato dai mitocondri delle cellule ossifile paratiroidee." },
            { id: 238, text: "Qual è la strategia chirurgica di scelta per l’iperparatiroidismo familiare (MEN1)?", options: ["Paratiroidectomia totale con autotrapianto di una porzione di ghiandola nel braccio", "Paratiroidectomia monolaterale (2 ghiandole) e lobectomia omolaterale della tiroide", "Paratiroidectomia monolaterale (2 ghiandole)", "Asportazione di una singola paratiroide"], correct: 0, explanation: "Essendo una iperplasia pluri-ghiandolare diffusa ed ereditaria, la rimozione conservativa fallirebbe. Si opta per un'asportazione estesa (subtotale o totale) inserendo chirurgicamente minuscoli frammenti paratiroidei sani nel braccio per facilitarne future ed eventuali re-asportazioni." },
            { id: 239, text: "L’iperparatiroidismo primario persistente dopo chirurgia delle paratiroidi è dovuto a:", options: ["Errore tecnico (mancata asportazione della ghiandola patologica)", "Recidiva a distanza della patologia paratiroidea", "Storia familiare di iperparatiroidismo primario", "Somministrazione di paratormone dopo la chirurgia"], correct: 0, explanation: "L'iperparatiroidismo si definisce 'persistente' quando la calcemia non cala mai fin dai primissimi giorni post-intervento, confermando che il chirurgo ha tecnicamente fallito nell'isolare l'adenoma bersaglio (magari perché occulto, frammentato o ectopico)." },
            { id: 240, text: "quando è indicato effettuare interventi sulle paratiroidi con chirurgia mini invasiva?", options: ["Nel caso di carcinoma delle paratiroidi", "Nel caso di un singolo è ben localizzato adenoma", "Nel caso di iperplasia con adenomi multipli a tutte le paratiroidi", "La chirurgia mini invasiva non viene mai utilizzata per interventi sulle paratiroidi"], correct: 1, explanation: "La Paratiroidectomia Mini-Invasiva (MIP) può essere eseguita tramite minuscole incisioni mirate unicamente quando le metodiche diagnostiche preoperatorie concordano con sicurezza indicando un singolo adenoma confinato e perfettamente localizzato." },
            { id: 241, text: "Quale dei seguenti ormoni è secreto dai cosiddetti carcinoidi (GI-NET) “classici”?", options: ["Adrenalina", "Serotonina", "Calcitonina", "Ossitocina"], correct: 1, explanation: "I tumori carcinoidi 'classici', in particolare quelli derivanti dall'intestino medio (midgut), sono noti per la massiccia secrezione di serotonina e altre sostanze vasoattive responsabili della sindrome da carcinoide." },
            { id: 242, text: "Nell’iperparatiroidismo primario, come può essere il livello di calcio sierico?", options: ["Elevato", "Normale", "Basso", "Normale o Elevato"], correct: 3, explanation: "Nell'iperparatiroidismo primario, il livello di calcio sierico può presentarsi francamente elevato (ipercalcemia) oppure, specialmente nelle fasi iniziali o in specifiche varianti (iperparatiroidismo normocalcemico), rimanere nei limiti della norma." },
            { id: 243, text: "Qual è la più frequente causa di iperparatiroidismo secondario?", options: ["Metastasi ossee", "Insufficienza renale cronica", "Adenoma paratiroideo ectopico", "Tumore renale"], correct: 1, explanation: "L'insufficienza renale cronica è la causa predominante dell'iperparatiroidismo secondario: l'incapacità dei reni di convertire la Vitamina D porta a ipocalcemia, che stimola continuamente le paratiroidi a produrre PTH." },
            { id: 244, text: "Quale delle seguenti procedure chirurgiche può rendersi necessaria durante una tiroidectomia totale se è presente un gozzo retrosternale di grosse dimensioni?", options: ["Asportazione dei linfonodi del collo e del mediastino", "Sternotomia", "Sezione dei muscoli sterno-cleido-mastoidei", "Tutte le precedenti risposte sono corrette"], correct: 1, explanation: "In presenza di un gozzo retrosternale (o cervico-mediastinico) di volumi talmente grossi da non poter essere dislocato nel collo in sicurezza, l'apertura dello sterno (sternotomia) si rende necessaria per estrarre la massa." },
            { id: 245, text: "Nel caso di un nodulo tiroideo benigno solitario, quale procedura chirurgica più indicata?", options: ["Tiroidectomia totale", "Tiroidectomia subtotale", "Lobectomia tiroidea unilaterale con rimozione dell’istmo", "Rimozione locale del singolo nodulo"], correct: 2, explanation: "La lobectomia unilaterale comprensiva dell'istmo è l'intervento definitivo e di prima scelta per asportare un nodulo benigno solitario confinato a un singolo lobo, minimizzando il rischio chirurgico." },
            { id: 246, text: "Nel caso di singolo carcinoma tiroideo (TIR5) localizzato in un lobo quale tipo di intervento è necessario effettuare?", options: ["Tiroidectomia totale", "Tiroidectomia subtotale", "Lobectomia tiroidea unilaterale con rimozione dell’istmo", "Rimozione locale del singolo nodulo"], correct: 0, explanation: "Per una lesione con citologia TIR5 (carcinoma accertato/altamente sospetto), le linee guida oncologiche indicano la tiroidectomia totale per eradicare la malattia e permettere le terapie successive." },
            { id: 247, text: "Che azione viene raccomandata dalle linee guida nel caso di categoria diagnostica TIR1 all’ago aspirato (FNA) di singolo nodulo tiroideo, che iconograficamente ha caratteristiche sospette dimensione superiore a un CM?", options: ["Follow-up senza trattamento chirurgico", "Lobectomia diagnostica", "Tiroidectomia subtotale", "Tiroidectomia totale"], correct: 1, explanation: "Quando il referto è TIR1 (inadeguato/non diagnostico) ma il nodulo è grande e l'ecografia è francamente sospetta, è prudente e raccomandato asportare metà tiroide (lobectomia diagnostica) per avere una diagnosi istologica certa." },
            { id: 248, text: "Se all’ago aspirato in un nodulo tiroideo (FNA) la diagnosi orienta verso un carcinoma midollare della tiroide, quale delle seguenti procedure diagnostiche è suggerita come primo step dalla Japan Association of Endocrine Surgery?", options: ["Counseling genetico", "Lobectomia diagnostica", "Asportazione di linfonodo sentinella per valutare l’eventuale presenza di metastasi linfonodali", "Valutazione dei valori di calcitonina nel sangue"], correct: 0, explanation: "Il counseling genetico è il primo passo raccomandato perché circa un quarto dei carcinomi midollari della tiroide è ereditario e legato a una mutazione del gene RET, e conoscerla prima dell'operazione è vitale per la tua sicurezza e per la scelta del tipo di chirurgia." },
            { id: 249, text: "Quale dei seguenti tumori tiroidei può insorgere nell’ambito di una MEN2?", options: ["Follicolare", "Papillare", "Midollare", "Carcinoma delle cellule di Hurtle"], correct: 2, explanation: "Il carcinoma midollare della tiroide è il marker clinico cardine ed immancabile delle sindromi familiari MEN2 (legate a mutazione del proto-oncogene RET)." },
            { id: 250, text: "Quale delle seguenti è la complicanza più seria della tiroidectomia?", options: ["Danno al nervo laringeo ricorrente", "Rimozione accidentale di una paratiroide", "Cicatrice cheloidea", "Edema laringeo"], correct: 0, explanation: "La lesione (soprattutto bilaterale) del nervo laringeo ricorrente provoca paralisi cordale, incapacità respiratoria e necessità di tracheostomia, configurando la complicanza più temibile della chirurgia tiroidea." },
            { id: 251, text: "Quali dei seguenti trattamenti può essere indicato dopo tiroidectomia totale o quasi totale per carcinoma della tiroide di qualunque variante istologica?", options: ["Terapia orale base di calcitonina", "Supplementazione di vitamina D", "Idratazione endovenosa sporadica", "Cicli di ablazione con radioiodio"], correct: 3, explanation: "Sebbene in modo vario a seconda delle 'varianti', per la stragrande maggioranza dei carcinomi differenziati della tiroide, l'ablazione con radioiodio (131-I) è il trattamento post-chirurgico d'elezione per distruggere ogni residuo o micrometastasi." },
            { id: 252, text: "Quale delle seguenti è associata a MEN2?", options: ["Insulinoma;", "Carcinoma papillare della tiroide;", "Feocromocitoma;", "Gastrinoma"], correct: 2, explanation: "La Neoplasia Endocrina Multipla di tipo 2 (MEN2) si presenta tipicamente con la classica associazione di carcinoma midollare della tiroide e feocromocitoma (presente in circa il 50% dei casi)." },
            { id: 253, text: "La legge del 10 può essere applicata a quale di questi tumori?", options: ["Feocromocitoma", "Carcinoide", "Carcinoma midollare della tiroide", "Tumore papillare della tiroide"], correct: 0, explanation: "La 'legge del 10' è storicamente e classicamente associata al Feocromocitoma (10% extra-surrenalico, 10% maligno, 10% bilaterale, 10% familiare, 10% pediatrico)." },
            { id: 254, text: "La causa più frequente di iperparatiroidismo primario sporadico è:", options: ["Adenoma paratiroideo", "Iperplasia paratiroidea", "Carcinoma paratiroideo", "Ectopica"], correct: 0, explanation: "Nella stragrande maggioranza dei casi (circa 80-85%), l'iperparatiroidismo primario in forma sporadica è sostenuto dalla presenza di un singolo adenoma benigno a carico di una paratiroide." },
            { id: 255, text: "La sindrome da carcinoide si scatena dopo quale insufficienza?", options: ["Insufficienza epatica", "Insufficienza cardiaca (per stenosi delle valvole)", "Insufficienza renale", "Insufficienza respiratoria"], correct: 1, explanation: "Attenendosi strettamente alla chiave di risposta fornita nel testo: 'Insufficienza cardiaca (per stenosi delle valvole)'. (Nota clinica: le placche fibrose indotte dalla serotonina causano danni stenosanti al cuore destro, portando ad insufficienza cardiaca)." },
            { id: 256, text: "Qual è il trattamento chirurgico preferito nei pazienti con iperplasia multi-ghiandolare per iperparatiroidismo familiare (MEN1)?", options: ["Resezione della ghiandola superiore e inferiore di un lato, lasciando le altre due ghiandole del lato opposto", "Resezione di una singola ghiandola ingrossata macroscopicamente", "Paratiroidectomia totale con autotrapianto di frammenti di tessuto paratiroideo dall'avambraccio", "Non c'è indicazione chirurgica ma solo per terapia medica"], correct: 2, explanation: "Essendo una iperplasia pluri-ghiandolare su base genetica, il trattamento chirurgico di scelta per prevenire recidive cervicali è la rimozione totale con successivo autotrapianto in un sito facilmente accessibile come l'avambraccio." },
            { id: 257, text: "Carcinoide più comune con origine nell'intestino medio (midgut):", options: ["Appendice", "Pancreas", "Diverticolo di Meckel", "Stomaco"], correct: 0, explanation: "NOTA: Il 45% di tutti i GI-NETs sono del piccolo intestino, in particolare nell'ileo distale (facente parte dell'intestino medio). Tra quelli elencati l'apendice è il più frequente, secondo tra quelli del midgut" },
            { id: 258, text: "Lo standard d'oro per l'adenoma corticale surrenalico singolo è:", options: ["Adrenalectomia totale laparoscopica/rimozione unilaterale laparoscopica", "Adrenalectomia bilaterale open", "Tumorectomia a cielo aperto", "Radioterapia locale"], correct: 0, explanation: "L'approccio in assoluto ritenuto il 'gold standard' per aggredire un singolo adenoma del surrene (es. adenomi di Cushing o Conn) è l'adrenalectomia unilaterale per via laparoscopica." },
            { id: 259, text: "Il PTH agisce su quali cellule?", options: ["Osteoclasti", "Osteoblasti", "Cellule C parafollicolari", "Cellule parietali gastriche"], correct: 0, explanation: "Il Paratormone (PTH) agisce massicciamente a livello osseo stimolando gli osteoclasti (in via indiretta e diretta) per aumentare il riassorbimento della matrice ossea e innalzare la calcemia." },
            { id: 260, text: "Qual è la complicanza più grave della chirurgia tiroidea?", options: ["Ipotiroidismo", "Ipertiroidismo", "Danno al nervo vago", "Infezione superficiale della ferita"], correct: 0, explanation: "Attenendosi in maniera specifica al testo sorgente fornito: l'ipotiroidismo. (L'asportazione chirurgica totale induce infatti l'azzeramento della produzione ormonale endogena che necessita di compenso a vita)." },
			
			// DOMANDE AGGIUNTE DOPO L'APPELLO DI MARZO
